        crewLines.textContent = db.users.length ? `成员：${db.users.map(u => `${u.name} ${SHORT_ROLE[u.role] || ''}`).join(' · ')}` : '';
        const me = curUser();
        if (document.activeElement !== el('meName')) el('meName').value = me.name || '';
        el('meRole').value = me.role || 'script';
        const avPrev = el('meAvatarPreview');
        if (avPrev) {
          avPrev.style.background = me.avatarUrl ? '#e9e5db' : (me.color || '#4d718f');
          avPrev.innerHTML = me.avatarUrl ? `<img src="${esc(me.avatarUrl)}" alt="" />` : esc(me.short || '?');
        }
        const avClear = el('meAvatarClear');
        if (avClear) avClear.hidden = !me.avatarPath;
        const avBtn = el('meAvatarBtn');
        if (avBtn) avBtn.textContent = me.avatarPath ? '更换头像' : '上传头像';
        modelGroups.innerHTML = ['text', 'image', 'video'].map(k => `<p class="mk-kind">${KIND_LABEL[k]}模型</p><div class="mk-chips">${modelsOf(k).map(m => `<span class="mk-chip">${esc(m.name)}<button type="button" data-del-model="${m.id}" aria-label="删除 ${esc(m.name)}">×</button></span>`).join('') || '<span style="color:#a49c8e;font-size:10px">暂无，先添加</span>'}</div>`).join('');
        modelGroups.querySelectorAll('[data-del-model]').forEach(btn => btn.addEventListener('click', () => {
          armOr(btn, '确认', () => { deleteModel(btn.dataset.delModel); renderSidebar(); renderInspector(); });
        }));
        const mc = el('modelCount');
        if (mc) mc.textContent = `${db.models.length} 个`;
        renderTopicSelect();
      }
      function renderTopicSelect() {
        const withContent = new Set(db.projects.map(p => p.topicId));
        const opt = c => `<option value="${c.id}">${String(c.id).padStart(2, '0')} · ${esc(c.name)}${withContent.has(c.id) ? '（已有项目）' : ''}</option>`;
        const hot = categories.filter(c => withContent.has(c.id));
        const rest = categories.filter(c => !withContent.has(c.id));
        const prev = topicSelect.value;
        topicSelect.innerHTML =
          (hot.length ? `<optgroup label="已有内容的主题">${hot.map(opt).join('')}</optgroup>` : '') +
          `<optgroup label="全部主题">${rest.map(opt).join('')}</optgroup>`;
        if (prev && [...topicSelect.options].some(o => o.value === prev)) topicSelect.value = prev;
      }

      function renderWorkspace() {
        const p = getProject();
        if (!p) {
          projectHead.innerHTML = '';
          viewTabs.innerHTML = '';
          viewRoot.innerHTML = '<div class="ws-empty" style="margin-top:26px"><h2>还没有项目</h2>点左上 ☰ 打开抽屉，从 42 个主题里新建第一个项目；同事登录后会实时看到同一份内容。</div>';
          return;
        }
        const topic = topicById(p.topicId);
        const r = doneRatio(p);
        projectHead.innerHTML = `<header class="proj-strip">
          <div class="ps-lead">
            <h1 class="ps-title">${esc(p.title)}</h1>
            <p class="ps-sub">${esc(topic ? topic.name : '未分类')} · ${esc(p.meta)} · <span class="gk">创建 ${esc(fmtAbs(p.createdAt))} · 更新 ${esc(fmtRel(p.updatedAt))}</span></p>
          </div>
          <div class="ps-side">
            <span class="ps-progress">${r.done}<i> / ${r.total} 完成</i></span>
            <select class="pill-select" id="projectStatusSel" aria-label="项目状态">${PROJECT_STATUS.map(s => `<option${s === p.status ? ' selected' : ''}>${s}</option>`).join('')}</select>
            <span class="people">${(p.members || []).map(m => avatarHTML(userById(m.userId))).join('')}</span>
          </div>
        </header>`;
        projectHead.querySelector('#projectStatusSel').addEventListener('change', e => {
          p.status = e.target.value;
          touchLocal(p, null);
          cw(sb.from('projects').update({ status: p.status, updated_at: p.updatedAt }).eq('id', p.id), '更新状态');
          renderSidebar();
        });
        const tabs = [
          ['pipeline', 'AI 流水线', p.stage === 'done' ? '✓' : `${stageIdx(p.stage || 'topic') + 1}/5`],
          ['script', '脚本', itemsOf(p, 'script').length],
          ['scenes', '场景', p.scenes.length],
          ['assets', '资产', p.assets.length],
          ['images', '图片', itemsOf(p, 'image').length],
          ['videos', '视频片段', itemsOf(p, 'video').length],
          ['copy', '文案版本', itemsOf(p, 'copy').reduce((n, i) => n + i.versions.length, 0)]
        ];
        viewTabs.innerHTML = tabs.map(([key, label, count]) => `<button type="button" class="${state.tab === key ? 'active' : ''}" data-tab="${key}">${label}<span class="cnt">${count}</span></button>`).join('');
        viewTabs.querySelectorAll('[data-tab]').forEach(btn => btn.addEventListener('click', () => { state.tab = btn.dataset.tab; renderWorkspace(); }));
        const views = { scenes: renderScenesView, script: renderScriptView, images: renderImagesView, videos: renderVideosView, copy: renderCopyView, assets: renderAssetsView, pipeline: renderPipelineView };
        views[state.tab]();
        bindItemCards();
      }

      /* ---------- 场景视图 ---------- */
      function stageEntry(p, scene) {
        const kinds = {
          script: scriptItem(p),
          image: sceneItem(p, 'image', scene.id) || null,
          video: sceneItem(p, 'video', scene.id) || null
        };
        let kind = state.stageKind;
        if (!kinds[kind]) kind = kinds.image ? 'image' : (kinds.script ? 'script' : (kinds.video ? 'video' : null));
        return { kind, kinds, item: kind ? kinds[kind] : null };
      }
      function sceneAddFormHTML(visible) {
        return `<form class="scene-add" id="sceneAddForm"${visible ? '' : ' hidden'}>
          <input class="st-input" id="sceneTitleInput" placeholder="场景标题，如：黑箱" required />
          <input class="st-input" id="sceneTimeInput" placeholder="时间码，如 00:00-00:18（可空）" />
          <button class="pill solid" type="submit">添加场景</button>
        </form>`;
      }
      function renderScenesView() {
        const p = getProject();
        if (!p.scenes.length) {
          viewRoot.innerHTML = `<div class="ws-empty"><h2>还没有分场景</h2>先在「脚本」里确定内容边界，再回到这里添加场景；每个场景会自动生成画面与视频任务。</div>${sceneAddFormHTML(true)}`;
          bindSceneAdd();
          return;
        }
        if (!state.sceneId || !sceneById(p, state.sceneId)) state.sceneId = p.scenes[0].id;
        const scene = sceneById(p, state.sceneId);
        const no = sceneNo(p, state.sceneId);
        const entry = stageEntry(p, scene);
        const item = entry.item;
        const timeDisp = scene.time ? scene.time.replace('-', ' — ') : '时间码待定';
        const chip = (kind, label) => {
          const it = entry.kinds[kind];
          if (!it) return `<button type="button" class="prod-chip mk" data-mk="${kind}" data-scene="${scene.id}">＋ ${label}</button>`;
          return `<button type="button" class="prod-chip${entry.kind === kind ? ' active' : ''}" data-stage="${kind}">${dot(it.status)}${label}</button>`;
        };
        let stageInner = '<div class="stage-ph">这个场景还没有内容。</div>';
        let capL = '', capR = '';
        if (item) {
          const lastVer = item.versions.length ? item.versions[item.versions.length - 1] : null;
          capL = `${TYPE_LABEL[item.type]} · ${item.title}${lastVer ? ` — v${lastVer.v} ${trunc(lastVer.note, 14)}` : ''} · ${item.model.name}`;
          capR = `${whoLine(item)}${statusWord(item.status)}`;
          if (entry.kind === 'image') {
            const src = currentSrc(item);
            stageInner = src ? `<img src="${esc(src)}" alt="${esc(item.title)}" />` : '<div class="stage-ph">画面尚未生成。写好提示词、选好模型，生成后在详情里上传结果。</div>';
          } else if (entry.kind === 'script') {
            const rows = ['action|动作', 'visual|画面', 'sound|声音', 'edit|剪辑'].map(pair => {
              const [key, label] = pair.split('|');
              return scene[key] ? `<div><b>${label}</b><span>${esc(scene[key])}</span></div>` : '';
            }).join('');
            stageInner = rows ? `<div class="stage-doc">${rows}</div>` : '<div class="stage-ph">尚未填写本场景的分镜内容。</div>';
          } else {
            const own = currentSrc(item);
            if (own && isVideoFile(own)) stageInner = `<video src="${esc(own)}" controls preload="metadata"></video>`;
            else if (own) stageInner = `<img src="${esc(own)}" alt="${esc(item.title)}" />`;
            else {
              const refSrc = currentSrc(entry.kinds.image);
              stageInner = refSrc
                ? `<img src="${esc(refSrc)}" alt="首帧参考" /><span class="stage-overlay">▶ 视频待生成 · 底图为首帧参考</span>`
                : '<div class="stage-ph">视频尚未生成，也还没有可用的首帧场景图。</div>';
            }
          }
        }
        viewRoot.innerHTML = `
          <div class="stage-row">
            <div class="stage-info">
              <p class="k-scene">SCENE ${String(no).padStart(2, '0')} / ${String(p.scenes.length).padStart(2, '0')}</p>
              <p class="k-time">${esc(timeDisp)}</p>
              <h2 class="k-title">${esc(scene.title)}</h2>
              ${scene.action ? `<p class="k-action">${esc(scene.action)}</p>` : '<p class="k-action">尚未填写场景动作描述。</p>'}
              ${scene.sound || scene.edit ? `<div class="k-extra">${scene.sound ? `<div><b>声音</b><span>${esc(scene.sound)}</span></div>` : ''}${scene.edit ? `<div><b>剪辑</b><span>${esc(scene.edit)}</span></div>` : ''}</div>` : ''}
              ${item ? `<div class="k-btns">
                <button class="pill" type="button" data-quick="prompt" data-item-id="${item.id}">提示词</button>
                <button class="pill" type="button" data-quick="model" data-item-id="${item.id}">模型</button>
                <button class="pill" type="button" data-quick="versions" data-item-id="${item.id}">版本 <span class="gk">${item.versions.length}</span></button>
                <button class="pill" type="button" data-quick="comments" data-item-id="${item.id}">评论 <span class="gk">${item.comments.filter(c => !c.sys).length}</span></button>
              </div>` : ''}
              <button class="st-linkbtn danger" type="button" id="delSceneBtn" style="margin-top:10px">删除本场景（含画面与视频任务）</button>
            </div>
            <div class="stage-col">
              <div class="prod-chips">${chip('script', '剧本')}${chip('image', '画面')}${chip('video', '视频')}</div>
              <div class="stage${item ? ' is-item' : ''}${entry.kind === 'video' ? ' is-video' : ''}"${item ? ` data-stage-item="${item.id}" role="button" tabindex="0" aria-label="打开详情"` : ''}>${stageInner}</div>
              ${item ? `<div class="stage-cap"><span class="stage-cap-l">${esc(capL)}</span><span class="stage-cap-r">${capR}</span></div>` : ''}
            </div>
          </div>
          <div class="filmstrip">${p.scenes.map((s, i) => {
            const imgIt = sceneItem(p, 'image', s.id);
            const src = currentSrc(imgIt);
            const phText = !imgIt ? '未创建' : (imgIt.status === 'doing' ? '生成中' : '待生成');
            return `<button type="button" class="cell${s.id === state.sceneId ? ' active' : ''}" data-scene="${s.id}">
              <span class="cell-thumb">${src ? `<img src="${esc(src)}" alt="${esc(s.title)}" loading="lazy" />` : `<span class="cell-ph">${phText}</span>`}</span>
              <span class="cell-cap">${dot(imgIt ? imgIt.status : null)}S${String(i + 1).padStart(2, '0')} ${esc(trunc(s.title, 6))}<em>${s.time ? esc(s.time.split('-')[0]) : '--:--'}</em></span>
            </button>`;
          }).join('')}<button type="button" class="cell add" id="sceneAddToggle"><span class="cell-thumb">＋ 场景</span></button></div>
          ${sceneAddFormHTML(false)}`;
        viewRoot.querySelectorAll('.cell[data-scene]').forEach(cellBtn => cellBtn.addEventListener('click', () => {
          state.sceneId = cellBtn.dataset.scene;
          state.stageKind = 'image';
          const sc = sceneById(p, state.sceneId);
          const e2 = stageEntry(p, sc);
          state.sel = e2.item ? e2.item.id : null;
          state.selVersion = null;
          renderWorkspace(); renderInspector();
        }));
        viewRoot.querySelectorAll('[data-stage]').forEach(btn => btn.addEventListener('click', () => {
          state.stageKind = btn.dataset.stage;
          const e2 = stageEntry(p, scene);
          state.sel = e2.item ? e2.item.id : null;
          state.selVersion = null;
          renderWorkspace(); renderInspector();
        }));
        const stageEl = viewRoot.querySelector('[data-stage-item]');
        if (stageEl) {
          stageEl.addEventListener('click', e => { if (e.target.tagName !== 'VIDEO') selectItem(stageEl.dataset.stageItem); });
          stageEl.addEventListener('keydown', e => { if (e.key === 'Enter') selectItem(stageEl.dataset.stageItem); });
        }
        const delSceneBtn = el('delSceneBtn');
        if (delSceneBtn) delSceneBtn.addEventListener('click', () => armOr(delSceneBtn, '再点一次确认删除本场景', async () => {
          delSceneBtn.disabled = true;
          const ok = await deleteScene(p, scene.id);
          if (ok) renderAll();
          else delSceneBtn.disabled = false;
        }));
        const toggle = el('sceneAddToggle');
        if (toggle) toggle.addEventListener('click', () => { const f = el('sceneAddForm'); f.hidden = !f.hidden; if (!f.hidden) el('sceneTitleInput').focus(); });
        bindSceneAdd();
      }
      function bindSceneAdd() {
        const form = el('sceneAddForm');
        if (!form) return;
        form.addEventListener('submit', async e => {
          e.preventDefault();
          const p = getProject();
          if (!p) return;
          const submitBtn = form.querySelector('button[type="submit"]');
          submitBtn.disabled = true;
          submitBtn.textContent = '添加中…';
          const sceneId = await addScene(p, el('sceneTitleInput').value.trim(), el('sceneTimeInput').value.trim());
          submitBtn.disabled = false;
          if (!sceneId) { renderAll(); return; }
          state.sceneId = sceneId;
          state.stageKind = 'image';
          renderAll();
        });
      }

      /* ---------- 脚本视图 ---------- */
      function renderScriptView() {
        const p = getProject();
        const scriptIt = scriptItem(p);
        const rows = s => ['action|动作', 'visual|画面', 'sound|声音', 'edit|剪辑'].map(pair => {
          const [key, label] = pair.split('|');
          return s[key] ? `<p class="sp-row"><b>${label}</b>${esc(s[key])}</p>` : '';
        }).join('');
        viewRoot.innerHTML = `
          ${scriptIt ? `<div class="doc-head" data-item="${scriptIt.id}" tabindex="0" role="button">
            <h2>${esc(scriptIt.title)}</h2>
            ${statusWord(scriptIt.status)}
            ${whoLine(scriptIt)}
            <span class="byline-mono">${esc(scriptIt.model.name)} · 更新${esc(fmtRel(scriptIt.updatedAt))} · 版本 ${scriptIt.versions.length}</span>
            <button class="pill sm" type="button" data-quick="prompt" data-item-id="${scriptIt.id}">提示词</button>
            <button class="pill sm" type="button" data-quick="model" data-item-id="${scriptIt.id}">模型</button>
          </div>` : '<div class="ws-empty"><h2>还没有脚本任务</h2></div>'}
          ${p.scenes.length ? `<ol class="screenplay">${p.scenes.map((s, i) => `<li class="sp-scene"><p class="sp-tc">S${String(i + 1).padStart(2, '0')}<em>${esc(s.time ? s.time.replace('-', ' — ') : '')}</em></p><div><h3>${esc(s.title)}</h3>${rows(s) || '<p class="sp-row">尚未填写场景内容。</p>'}</div></li>`).join('')}</ol>` : '<div class="ws-empty"><h2>脚本还没有分场景</h2>在「场景」页添加场景后，这里会按时间码展示完整分镜。</div>'}`;
      }

      /* ---------- 图片视图 ---------- */
      function renderImagesView() {
        const p = getProject();
        const imgs = itemsOf(p, 'image');
        const sceneRef = it => it.sceneId ? `S${String(sceneNo(p, it.sceneId)).padStart(2, '0')}` : '通用素材';
        viewRoot.innerHTML = `<div class="view-head"><h2>图片</h2><span class="gk">PLATES / ${imgs.length}</span>${legendHTML()}</div>
          ${imgs.length ? `<div class="gal">${imgs.map(it => {
            const src = currentSrc(it);
            return `<button type="button" class="g-card${it.id === state.sel ? ' selected' : ''}" data-item="${it.id}" aria-label="${esc(it.title)}">
              <span class="g-thumb">${src ? `<img src="${esc(src)}" alt="${esc(it.title)}" loading="lazy" />` : '<span class="g-ph">待生成</span>'}</span>
              <span class="g-cap">
                <span class="g-cap1">${esc(sceneRef(it))} · ${esc(it.model.name)} · 版本 ${it.versions.length} · 更新${esc(fmtRel(it.updatedAt))}</span>
                <span class="g-cap2">${esc(it.title)}</span>
                <span class="g-cap3">${statusWord(it.status)}${whoLine(it)}</span>
              </span>
            </button>`;
          }).join('')}</div>` : '<div class="ws-empty"><h2>还没有画面素材</h2>在「场景」页为具体场景创建画面任务。</div>'}`;
      }

      /* ---------- 视频视图 ---------- */
      function renderVideosView() {
        const p = getProject();
        const vids = itemsOf(p, 'video');
        viewRoot.innerHTML = `<div class="view-head"><h2>视频片段</h2><span class="gk">SHOTS / ${vids.length}</span>${legendHTML()}</div>
          ${vids.length ? `<div class="v-rows">${vids.map(it => {
            const own = currentSrc(it);
            const refSrc = own || (it.sceneId ? currentSrc(sceneItem(p, 'image', it.sceneId)) : null);
            return `<button type="button" class="v-row${it.id === state.sel ? ' selected' : ''}" data-item="${it.id}">
              <span class="v-no">${it.sceneId ? `S${String(sceneNo(p, it.sceneId)).padStart(2, '0')}` : '--'}</span>
              <span class="v-thumb">${refSrc && !isVideoFile(refSrc) ? `<img src="${esc(refSrc)}" alt="参考帧" loading="lazy" />` : (refSrc ? '<span class="g-ph">▶ 已有成片</span>' : '<span class="g-ph">无首帧</span>')}</span>
              <span class="v-main"><span class="v-title">${esc(it.title)}</span><span class="v-sub">${esc(it.model.name)} · ${esc(userById(it.ownerId).name)} 负责 · 更新${esc(fmtRel(it.updatedAt))}</span></span>
              ${statusWord(it.status)}
              <span class="mini-link" data-quick="prompt" data-item-id="${it.id}">提示词</span>
            </button>`;
          }).join('')}</div>` : '<div class="ws-empty"><h2>还没有视频任务</h2>在「场景」页为具体场景创建视频任务。</div>'}`;
      }

      /* ---------- 文案版本视图 ---------- */
      function renderCopyView() {
        const p = getProject();
        const copies = itemsOf(p, 'copy');
        if (!copies.length) {
          viewRoot.innerHTML = `<div class="view-head"><h2>文案版本</h2><span class="gk">COPY / 0</span></div>
            <div class="ws-empty"><h2>还没有发布文案</h2>为项目创建一份发布文案，标题与简介的每一版都会留在版本记录里。<br><br><button class="pill solid" type="button" id="mkCopyBtn">新建发布文案</button></div>`;
          el('mkCopyBtn').addEventListener('click', async () => {
            const button = el('mkCopyBtn');
            button.disabled = true;
            button.textContent = '创建中…';
            const item = await mkCopyItem(p);
            if (!item) { renderAll(); return; }
            state.tab = 'copy'; state.sel = item.id; renderAll();
          });
          return;
        }
        viewRoot.innerHTML = `<div class="view-head"><h2>文案版本</h2><span class="gk">COPY / ${copies.reduce((n, i) => n + i.versions.length, 0)}</span></div>` + copies.map(it => {
          const viewing = it.versions.find(v => v.v === state.selVersion && it.id === state.sel) || it.versions[it.versions.length - 1];
          return `<section class="copy-wrap" data-copy="${it.id}">
            <div class="doc-head" data-item="${it.id}" tabindex="0" role="button">
              <h2>${esc(it.title)}</h2>
              ${statusWord(it.status)}
              ${whoLine(it)}
              <span class="byline-mono">${esc(it.model.name)} · 更新${esc(fmtRel(it.updatedAt))}</span>
              <button class="pill sm" type="button" data-quick="detail" data-item-id="${it.id}">详情 / 评论</button>
            </div>
            ${it.versions.length ? `<div class="ver-chips">${it.versions.map(v => `<button type="button" class="ver-chip${v.v === it.versions.length ? ' cur' : ''}${viewing && v.v === viewing.v ? ' viewing' : ''}" data-copy-ver="${v.v}" data-item-id="${it.id}">v${v.v}${v.v === it.versions.length ? ' · 当前' : ''}</button>`).join('')}</div>
            <div class="copy-page">${esc(viewing.body || '')}</div>
            <p class="copy-caption">正在查看：v${viewing.v} · ${esc(viewing.note)}${viewing.model ? ` · ${esc(viewing.model)}` : ''} · ${esc(userById(viewing.by).name)} · ${esc(fmtAbs(viewing.at))}</p>` : '<div class="copy-page">还没有文案版本，在下方写第一版。</div>'}
            <form class="copy-new" data-item-id="${it.id}">
              <input class="st-input" name="note" placeholder="版本说明，如：收紧标题（可空）" />
              <textarea name="body" placeholder="标题：…&#10;简介：…&#10;话题：#…" required></textarea>
              <button class="pill solid" type="submit">存为 v${it.versions.length + 1}</button>
            </form>
          </section>`;
        }).join('');
        viewRoot.querySelectorAll('[data-copy-ver]').forEach(btn => btn.addEventListener('click', () => {
          state.sel = btn.dataset.itemId;
          state.selVersion = Number(btn.dataset.copyVer);
          renderWorkspace(); renderInspector();
        }));
        viewRoot.querySelectorAll('form.copy-new').forEach(form => form.addEventListener('submit', async e => {
          e.preventDefault();
          const item = itemById(p, form.dataset.itemId);
          const body = form.body.value.trim();
          if (!item || !body) return;
          const submitBtn = form.querySelector('button[type="submit"]');
          submitBtn.disabled = true;
          submitBtn.textContent = '保存中…';
          const ok = await addCopyVersion(p, item, form.note.value.trim(), body);
          if (!ok) { renderAll(); return; }
          state.sel = item.id; state.selVersion = null;
          renderAll();
        }));
      }

      /* ---------- 通用绑定 ---------- */
      function bindItemCards() {
        viewRoot.querySelectorAll('[data-item]').forEach(card => {
          card.addEventListener('click', e => {
            if (e.target.closest('.mini-link') || e.target.closest('.pill')) return;
            selectItem(card.dataset.item);
          });
          card.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target === card) selectItem(card.dataset.item); });
        });
        viewRoot.querySelectorAll('[data-quick]').forEach(btn => btn.addEventListener('click', e => {
          e.stopPropagation();
          selectItem(btn.dataset.itemId, btn.dataset.quick === 'detail' ? null : btn.dataset.quick);
        }));
        viewRoot.querySelectorAll('[data-mk]').forEach(btn => btn.addEventListener('click', async e => {
          e.stopPropagation();
          const p = getProject();
          if (!p) return;
          const scene = sceneById(p, btn.dataset.scene);
          btn.disabled = true;
          const item = await insertTaskItem(p, btn.dataset.mk, btn.dataset.scene, scene ? scene.title : '场景');
          if (!item) { renderAll(); return; }
          p.items.push(item);
          touchLocal(p, item);
          cw(sb.from('projects').update({ updated_at: p.updatedAt }).eq('id', p.id));
          state.sel = item.id;
          if (btn.dataset.mk === 'image' || btn.dataset.mk === 'video') state.stageKind = btn.dataset.mk;
          renderAll();
        }));
      }

      /* ---------- 详情抽屉 ---------- */
      function modelText(item) {
        const gen = item.versions.length ? item.versions[item.versions.length - 1] : null;
        return `模型：${item.model.name}\n模式：${item.model.mode}\n参考：${item.model.refs}${gen ? `\n最近生成：v${gen.v} · ${fmtAbs(gen.at)} · ${userById(gen.by).name}${gen.model ? ` · ${gen.model}` : ''}` : '\n最近生成：暂无记录'}`;
      }
      function inspectorCap(refText) {
        return `<div class="ins-cap"><p>${esc(refText)}</p><button class="ins-close" type="button" id="insClose" aria-label="关闭">×</button></div>`;
      }
      function renderInspector(focusSec) {
        const changedItem = renderInspector._last !== state.sel;
        renderInspector._last = state.sel;
        if (changedItem && !focusSec) state.insTab = 'info';
        if (focusSec) state.insTab = (focusSec === 'prompt' || focusSec === 'model') ? 'gen' : (focusSec === 'versions' ? 'vers' : (focusSec === 'comments' ? 'cmts' : 'info'));
        if (!['info', 'gen', 'vers', 'cmts'].includes(state.insTab)) state.insTab = 'info';
        const p = getProject();
        const item = p && state.sel ? itemById(p, state.sel) : null;
        if (!item) {
          inspector.innerHTML = `${inspectorCap('内容详情')}
            <h3 class="ins-title">选择一项内容</h3>
            <p class="ins-desc">点击任意剧本、画面、视频或文案条目，这里会分页展示它的详情、生成设置、版本记录与评论。</p>
            <div class="ins-rows">
              <div class="ins-row"><span>生成流程</span><strong>写提示词 → 选模型 → 生成 → 上传登记</strong></div>
              <div class="ins-row"><span>版本快照</span><strong>登记时保存当时的提示词与模型</strong></div>
            </div>`;
          bindInspectorCommon();
          return;
        }
        const kind = KIND_OF_TYPE[item.type];
        const scene = item.sceneId ? sceneById(p, item.sceneId) : null;
        const no = item.sceneId ? sceneNo(p, item.sceneId) : null;
        const viewingVer = state.selVersion ? item.versions.find(v => v.v === state.selVersion) : null;
        let preview = '';
        if (item.type === 'copy') {
          const body = (viewingVer || item.versions[item.versions.length - 1] || {}).body;
          preview = body ? `<div class="ins-preview"><pre class="ins-pre">${esc(body)}</pre></div>` : '<div class="ins-preview"><div class="ph">还没有文案版本。</div></div>';
        } else if (item.type === 'video') {
          const own = viewingVer && viewingVer.src ? viewingVer.src : currentSrc(item);
          if (own && isVideoFile(own)) {
            preview = `<div class="ins-preview"><video src="${esc(own)}" controls preload="metadata"></video></div>${viewingVer ? `<span class="ins-badge">正在查看 v${viewingVer.v} · ${esc(viewingVer.note)}</span>` : ''}`;
          } else if (own) {
            preview = `<div class="ins-preview"><img src="${esc(own)}" alt="${esc(item.title)}" /></div>${viewingVer ? `<span class="ins-badge">正在查看 v${viewingVer.v} · ${esc(viewingVer.note)}</span>` : ''}`;
          } else {
            const refImg = scene ? sceneItem(p, 'image', scene.id) : null;
            const refSrc = currentSrc(refImg);
            preview = refSrc
              ? `<div class="ins-preview"><img src="${esc(refSrc)}" alt="首帧参考" style="opacity:.82" /></div><span class="ins-badge">视频待生成 — 上图为首帧参考</span>`
              : '<div class="ins-preview"><div class="ph">视频尚未生成。生成后在「生成」页上传结果文件。</div></div>';
          }
        } else if (item.type === 'image') {
          const src = viewingVer && viewingVer.src ? viewingVer.src : currentSrc(item);
          preview = src
            ? `<div class="ins-preview"><img src="${esc(src)}" alt="${esc(item.title)}" /></div>${viewingVer ? `<span class="ins-badge">正在查看 v${viewingVer.v} · ${esc(viewingVer.note)}</span>` : ''}`
            : '<div class="ins-preview"><div class="ph">画面尚未生成。生成后在「生成」页上传结果文件。</div></div>';
        }
        const cmCount = item.comments.filter(c => !c.sys).length;
        const tabsHTML = `<div class="ins-tabs">
          <button type="button" class="${state.insTab === 'info' ? 'active' : ''}" data-instab="info">详情</button>
          <button type="button" class="${state.insTab === 'gen' ? 'active' : ''}" data-instab="gen">生成</button>
          <button type="button" class="${state.insTab === 'vers' ? 'active' : ''}" data-instab="vers">版本<span class="gk">${item.versions.length}</span></button>
          <button type="button" class="${state.insTab === 'cmts' ? 'active' : ''}" data-instab="cmts">评论<span class="gk">${cmCount}</span></button>
        </div>`;
        let pane = '';
        if (state.insTab === 'info') {
          pane = `
            <p class="ins-desc" style="margin:0 0 11px">${esc(item.desc)}</p>
            ${preview}
            <div class="ins-rows" style="margin-top:13px">
              <div class="ins-row"><span>所属场景</span><strong>${scene ? `S${String(no).padStart(2, '0')} · ${esc(scene.time || scene.title)}` : (item.type === 'script' ? `整片 · ${p.scenes.length} 个场景` : '整个项目')}</strong></div>
              <div class="ins-row"><span>负责人</span><select id="ownerSel">${db.users.map(u => `<option value="${u.id}"${u.id === item.ownerId ? ' selected' : ''}>${esc(u.name)} · ${esc(ROLE_LABEL[u.role])}</option>`).join('')}</select></div>
              <div class="ins-row"><span>状态</span><select id="statusSel">${Object.keys(STATUS).map(k => `<option value="${k}"${k === item.status ? ' selected' : ''}>${STATUS[k].label}</option>`).join('')}</select></div>
              <div class="ins-row"><span>创建时间</span><strong>${esc(fmtAbs(item.createdAt))}</strong></div>
              <div class="ins-row"><span>最近修改</span><strong>${esc(fmtRel(item.updatedAt))}（${esc(fmtAbs(item.updatedAt))}）</strong></div>
            </div>
            <div class="ins-danger"><button class="st-linkbtn danger" type="button" id="delItemBtn">删除此内容（含 ${item.versions.length} 个版本、文件与全部评论）</button></div>`;
        } else if (state.insTab === 'gen') {
          const promptSec = state.editPrompt
            ? `<div class="prompt-edit">
                <textarea id="promptEditTa">${esc(item.prompt || '')}</textarea>
                <div class="row"><button class="pill sm" type="button" id="promptCancelBtn">取消</button><button class="pill sm solid" type="button" id="promptSaveBtn">保存提示词</button></div>
              </div>`
            : (item.prompt ? `<pre class="ins-pre">${esc(item.prompt)}</pre>` : '<p class="ins-desc" style="margin:0">尚未填写提示词。点「编辑」写第一版。</p>');
          const modelOptions = (() => {
            const names = modelsOf(kind).map(m => m.name);
            const list = names.includes(item.model.name) ? names : [item.model.name, ...names];
            return list.map(n => `<option value="${esc(n)}"${n === item.model.name ? ' selected' : ''}>${esc(n)}</option>`).join('');
          })();
          const registerSec = item.type === 'copy'
            ? '<p class="ins-desc" style="margin:0">新的文案正文在「文案版本」页撰写并保存，会自动成为新版本。</p>'
            : `<form class="ver-form" id="verForm" style="margin-top:0;padding-top:0;border-top:0">
                <input class="st-input" name="note" placeholder="生成说明，如：第 ${item.versions.length + 1} 次生成 · 收紧构图（可空）" />
                ${kind !== 'text' ? `<label class="file-row"><input type="file" id="verFile" accept="${kind === 'video' ? 'video/*' : 'image/*'}" hidden /><button class="pill sm" type="button" id="verFileBtn">选择${KIND_LABEL[kind]}文件</button><span class="file-name" id="verFileName">未选择（可空）</span></label>` : ''}
                <button class="pill sm accent" type="submit" id="verSubmitBtn">上传并登记 v${item.versions.length + 1}</button>
              </form>`;
          pane = `
            <section class="ins-sec" data-sec="prompt" style="margin-top:0">
              <div class="ins-sec-head"><h4>① 精准提示词</h4><span class="ver-actions">${state.editPrompt ? '' : '<button class="mini-link" type="button" id="editPromptBtn">编辑</button>'}<button class="mini-link" type="button" id="copyPromptBtn">复制</button></span></div>
              ${promptSec}
            </section>
            <section class="ins-sec" data-sec="model">
              <div class="ins-sec-head"><h4>② 模型<span class="gk">${esc(KIND_LABEL[kind])}类</span></h4><button class="mini-link" type="button" id="copyModelBtn">复制</button></div>
              <div class="ins-rows" style="margin-top:0">
                <div class="ins-row"><span>模型</span><select id="modelSel">${modelOptions}</select></div>
                <div class="ins-row"><span>模式</span><input type="text" id="modeInput" value="${esc(item.model.mode)}" /></div>
                <div class="ins-row"><span>参考</span><input type="text" id="refsInput" value="${esc(item.model.refs)}" /></div>
              </div>
            </section>
            <section class="ins-sec" data-sec="register">
              <div class="ins-sec-head"><h4>③ 生成后上传登记</h4></div>
              ${registerSec}
            </section>`;
        } else if (state.insTab === 'vers') {
          const versionsHTML = item.versions.length
            ? `<ol class="ver-list">${[...item.versions].reverse().map(v => {
                const clickable = v.src || v.body;
                const viewing = state.selVersion === v.v;
                return `<li class="ver-item${viewing ? ' viewing' : ''}">
                  <div class="ver-line"><span class="ver-tag">v${v.v}</span>${esc(v.note)}${v.v === item.versions.length ? '（当前）' : ''}</div>
                  <span class="ver-meta">${v.model ? `${esc(v.model)} · ` : ''}${esc(userById(v.by).name)} · ${esc(fmtAbs(v.at))}<span class="ver-actions">${clickable ? `<button class="mini-link" type="button" data-ver="${v.v}">${viewing ? '收起' : '查看'}</button>` : ''}${v.filePath ? `<button class="mini-link ver-dl" type="button" data-dl-ver="${v.v}">下载</button>` : ''}<button class="mini-link ver-del" type="button" data-del-ver="${v.v}">删除</button></span></span>
                </li>`;
              }).join('')}</ol>`
            : '<p class="ins-desc" style="margin:0">暂无版本。生成后在「生成」页上传登记，会快照当时的提示词与模型。</p>';
          pane = `
            ${state.selVersion ? `<div style="margin-bottom:12px">${preview}</div>` : ''}
            <div class="ins-sec-head" style="margin-bottom:8px"><h4>版本记录<span class="gk">${item.versions.length}</span></h4>${state.selVersion ? '<button class="mini-link" type="button" id="backCurrentBtn">回到当前版</button>' : ''}</div>
            ${versionsHTML}
            <p style="margin:12px 0 0"><button class="mini-link" type="button" data-instab="gen">＋ 登记新的生成结果</button></p>`;
        } else {
          const commentsHTML = item.comments.length
            ? `<div class="cm-list">${item.comments.map(c => {
                const u = userById(c.by);
                return c.sys
                  ? `<p class="cm-sys"><strong>${esc(u.name)}</strong> ${esc(c.text)} · ${esc(fmtRel(c.at))}</p>`
                  : `<div class="cm-item">${avatarHTML(u, true)}<div><p class="cm-head"><strong>${esc(u.name)}</strong> · ${esc(fmtRel(c.at))}</p><p>${esc(c.text)}</p></div></div>`;
              }).join('')}</div>`
            : '<p class="ins-desc" style="margin:0">还没有评论。</p>';
          pane = `${commentsHTML}
            <form class="cm-form" id="commentForm">
              <textarea placeholder="以 ${esc(curUser().name)} 的身份评论…" required></textarea>
              <button class="pill sm solid" type="submit">发表评论</button>
            </form>`;
        }
        inspector.innerHTML = `
          ${inspectorCap(`${TYPE_LABEL[item.type]}${scene ? ` · S${String(no).padStart(2, '0')}` : ''} · ${KIND_LABEL[kind]}生成`)}
          <h3 class="ins-title">${esc(item.title)}</h3>
          <div class="ins-byline">${statusWord(item.status)}${whoLine(item)}<span class="byline-mono">更新${esc(fmtRel(item.updatedAt))}</span></div>
          ${tabsHTML}
          <div class="ins-pane">${pane}</div>`;
        inspector.querySelectorAll('[data-instab]').forEach(btn => btn.addEventListener('click', () => { state.insTab = btn.dataset.instab; renderInspector(); }));
        const ownerSel = inspector.querySelector('#ownerSel');
        if (ownerSel) ownerSel.addEventListener('change', e => { setOwner(p, item, e.target.value); renderAll(); });
        const statusSel = inspector.querySelector('#statusSel');
        if (statusSel) statusSel.addEventListener('change', e => { setStatus(p, item, e.target.value); renderAll(); });
        const copyPromptBtn = inspector.querySelector('#copyPromptBtn');
        if (copyPromptBtn) copyPromptBtn.addEventListener('click', e => copyText(item.prompt || '', e.target));
        const copyModelBtn = inspector.querySelector('#copyModelBtn');
        if (copyModelBtn) copyModelBtn.addEventListener('click', e => copyText(modelText(item), e.target));
        const editBtn = inspector.querySelector('#editPromptBtn');
        if (editBtn) editBtn.addEventListener('click', () => { state.editPrompt = true; renderInspector(); });
        const saveBtn = inspector.querySelector('#promptSaveBtn');
        if (saveBtn) saveBtn.addEventListener('click', () => {
          setPrompt(p, item, inspector.querySelector('#promptEditTa').value.trim());
          state.editPrompt = false;
          renderAll();
        });
        const cancelBtn = inspector.querySelector('#promptCancelBtn');
        if (cancelBtn) cancelBtn.addEventListener('click', () => { state.editPrompt = false; renderInspector(); });
        const modelSel = inspector.querySelector('#modelSel');
        if (modelSel) modelSel.addEventListener('change', e => { setModelName(p, item, e.target.value); renderAll(); });
        const modeInput = inspector.querySelector('#modeInput');
        if (modeInput) modeInput.addEventListener('change', e => { setModelField(p, item, 'mode', e.target.value.trim()); renderInspector(); });
        const refsInput = inspector.querySelector('#refsInput');
        if (refsInput) refsInput.addEventListener('change', e => { setModelField(p, item, 'refs', e.target.value.trim()); renderInspector(); });
        const backBtn = inspector.querySelector('#backCurrentBtn');
        if (backBtn) backBtn.addEventListener('click', () => { state.selVersion = null; renderInspector(); if (state.tab === 'copy') renderWorkspace(); });
        inspector.querySelectorAll('[data-ver]').forEach(btn => btn.addEventListener('click', () => {
          state.selVersion = state.selVersion === Number(btn.dataset.ver) ? null : Number(btn.dataset.ver);
          renderInspector();
          if (state.tab === 'copy') renderWorkspace();
        }));
        inspector.querySelectorAll('[data-dl-ver]').forEach(btn => btn.addEventListener('click', () => {
          const ver = item.versions.find(x => x.v === Number(btn.dataset.dlVer));
          if (ver) downloadVersion(ver, item.title);
        }));
        inspector.querySelectorAll('[data-del-ver]').forEach(btn => btn.addEventListener('click', () => {
          armOr(btn, '确认删除', () => { deleteVersion(p, item, Number(btn.dataset.delVer)); renderAll(); });
        }));
        const verFile = inspector.querySelector('#verFile');
        const verFileBtn = inspector.querySelector('#verFileBtn');
        if (verFileBtn) {
          verFileBtn.addEventListener('click', () => verFile.click());
          verFile.addEventListener('change', () => {
            inspector.querySelector('#verFileName').textContent = verFile.files.length ? `${verFile.files[0].name}（${(verFile.files[0].size / 1048576).toFixed(1)}MB）` : '未选择（可空）';
          });
        }
        const verForm = inspector.querySelector('#verForm');
        if (verForm) verForm.addEventListener('submit', async e => {
          e.preventDefault();
          const submitBtn = inspector.querySelector('#verSubmitBtn');
          const file = verFile && verFile.files.length ? verFile.files[0] : null;
          submitBtn.disabled = true;
          submitBtn.textContent = file ? '上传中…' : '登记中…';
          const ok = await addVersion(p, item, verForm.note.value, file);
          submitBtn.disabled = false;
          if (ok !== false) { state.insTab = 'vers'; renderAll(); }
          else renderInspector();
        });
        const commentForm = inspector.querySelector('#commentForm');
        if (commentForm) commentForm.addEventListener('submit', e => {
          e.preventDefault();
          const text = e.target.querySelector('textarea').value.trim();
          if (!text) return;
          addComment(p, item, text);
          renderAll();
        });
        const delItemBtn = inspector.querySelector('#delItemBtn');
        if (delItemBtn) delItemBtn.addEventListener('click', () => armOr(delItemBtn, '再点一次确认删除此内容', () => {
          deleteItem(p, item.id);
          closeOverlays();
          renderAll();
        }));
        bindInspectorCommon();
        inspector.scrollTop = 0;
      }
      function bindInspectorCommon() {
        const close = inspector.querySelector('#insClose');
        if (close) close.addEventListener('click', closeOverlays);
      }

      /* ---------- 选中 / 抽屉 ---------- */
      function selectItem(id, focusSec, open) {
        state.sel = id;
        state.selVersion = null;
        state.editPrompt = false;
        viewRoot.querySelectorAll('[data-item]').forEach(c => c.classList.toggle('selected', c.dataset.item === id));
        renderInspector(focusSec);
        if (open !== false) { document.body.classList.add('drawer-open'); document.body.classList.remove('nav-open'); scrim.hidden = false; }
      }
      function closeOverlays() {
        document.body.classList.remove('drawer-open', 'nav-open');
        scrim.hidden = true;
      }
      function openProject(id) {
        state.projectId = id;
        const p = getProject();
        state.tab = landingTab(p);
        state.sceneId = p && p.scenes.length ? p.scenes[0].id : null;
        state.stageKind = 'image';
        state.sel = null;
        state.selVersion = null;
        state.editPrompt = false;
        closeOverlays();
        renderAll();
      }

      function copyText(text, btn) {
        const done = () => {
          if (!btn) return;
          const t = btn.textContent;
          btn.textContent = '已复制';
          setTimeout(() => { btn.textContent = t; }, 1200);
        };
        const fallback = () => {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.cssText = 'position:fixed;opacity:0';
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); done(); } catch (e) {}
          ta.remove();
        };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(fallback);
        else fallback();
      }

      function renderAll(focusSec) {
        renderTopbar();
        renderSidebar();
        renderWorkspace();
        renderInspector(focusSec);
      }

      /* ---------- 全局事件 ---------- */
      el('createProjectBtn').addEventListener('click', async () => {
        const topicId = Number(topicSelect.value);
        if (!topicId) return;
        const createBtn = el('createProjectBtn');
        createBtn.disabled = true;
        createBtn.textContent = '创建中…';
        const project = await createProject(topicId, newProjectName.value);
        createBtn.disabled = false;
        createBtn.textContent = '从主题新建项目';
        if (!project) return;
        newProjectName.value = '';
        openProject(project.id);
        state.tab = 'script';
        state.sel = project.items[0] ? project.items[0].id : null;
        renderAll();
        toast(`已创建项目「${project.title}」— 先写分镜脚本，再去「场景」加场景`);
      });
      el('modelAddForm').addEventListener('submit', e => {
        e.preventDefault();
        const form = e.target;
        const name = form.name.value.trim();
        if (!name) return;
        addModel(form.kind.value, name);
        form.name.value = '';
        renderSidebar();
        renderInspector();
      });
      el('meName').addEventListener('change', e => { const v = e.target.value.trim(); if (v) { updateMyProfile({ name: v }); renderAll(); } });
      el('meRole').addEventListener('change', e => { updateMyProfile({ role: e.target.value }); renderAll(); });
      el('meAvatarBtn').addEventListener('click', () => el('meAvatarFile').click());
      el('meAvatarFile').addEventListener('change', async e => {
        const file = e.target.files && e.target.files[0];
        e.target.value = '';
        await uploadMyAvatar(file);
      });
      el('meAvatarClear').addEventListener('click', e => armOr(e.target, '确认移除', clearMyAvatar));
      el('logoutBtn').addEventListener('click', async () => { if (sb) await sb.auth.signOut(); location.reload(); });
      el('navToggle').addEventListener('click', () => {
        const open = document.body.classList.toggle('nav-open');
        document.body.classList.remove('drawer-open');
        scrim.hidden = !open;
      });
      scrim.addEventListener('click', closeOverlays);
      document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOverlays(); });

      /* ---------- 启动入口 ---------- */
      if (!window.supabase) {
        renderGate('setup', '核心组件未能加载，请刷新页面重试。若反复出现，请联系管理员。');
      } else if (!getConfig()) {
        renderGate('setup');
      } else {
        initClient();
        (async () => {
          try {
            const { data } = await sb.auth.getSession();
            if (data && data.session) { renderGate('loading'); await boot(data.session); }
            else renderGate('login');
          } catch (e) { renderGate('login', '连接失败，请检查网络或服务器配置。'); }
        })();
      }
    })();
  </script>
</body>
</html>
