<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 发布后同事刷新就能拿到新版，不会卡在浏览器缓存的旧版本上 -->
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
  <meta name="description" content="AI 视频协作工作台 · 云端版（Supabase）" />
  <title>ORBIT STUDIO · 协作工作台（云端版）</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600&display=swap');
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    /* ===== 协作工作台 v4 · 放映间（方向 C）：画面与时间轴为主角的浅色制作台。选题索引页数据与样式完整保留 ===== */
    :root {
      /* 强调色 · 拉丝钢（改这里即可全局换色） */
      --ac: #4a4842;
      --ac-dark: #33312c;
      --ac-edge: #33312c;
      --ac-rgb: 74, 72, 66;
      --ac-metal: linear-gradient(180deg,#8b877e 0%,#67635b 14%,#4e4b45 44%,#403d38 50%,#4a4741 56%,#615d56 86%,#7d7970 100%);
      --ac-metal-hover: linear-gradient(180deg,#7e7a71 0%,#5b574f 14%,#44413b 44%,#37342f 50%,#413e38 56%,#56524b 86%,#706c63 100%);
      --ac-brush: repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,rgba(0,0,0,.05) 1px 2px);
      --ac-hi: rgba(255,255,255,.3);
      --ac-sheen: linear-gradient(90deg,#3b3934 0%,#6e6a61 50%,#3b3934 100%);
    }
    body.collab-mode { min-width: 320px; color: #211e19; background: #f3f1ec; font-family: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", sans-serif; letter-spacing: 0; }
    body.collab-mode > .topbar, body.collab-mode > .hero, body.collab-mode > main:not(.collab-main) { display: none !important; }
    body:not(.collab-mode) .collab-shell, body:not(.collab-mode) .st-scrim, body:not(.collab-mode) .side-panel, body:not(.collab-mode) .inspector-panel { display: none !important; }
    .back-to-studio { display: none; }
    body:not(.collab-mode) .back-to-studio { display: inline-flex; align-items: center; gap: 6px; position: fixed; right: 18px; bottom: 18px; z-index: 90; border: 1px solid var(--ac); border-radius: 999px; background: var(--ac); color: #f6f4ef; padding: 10px 18px; font: 600 12.5px/1 "Noto Sans SC", sans-serif; box-shadow: 0 12px 30px rgba(var(--ac-rgb), .3); cursor: pointer; }

    .collab-shell { display: flex; flex-direction: column; width: 100%; height: 100vh; min-height: 620px; margin: 0 auto; padding: 0 44px; box-sizing: border-box; }
    .studio-bar, #projectHead, .view-tabs { flex: none; }
    .collab-shell select, .collab-shell textarea, .collab-shell input, .side-panel select, .side-panel input, .inspector-panel select, .inspector-panel textarea { font: inherit; color: inherit; }
    .collab-shell textarea, .inspector-panel textarea { resize: vertical; }
    .gk { font-family: "Space Grotesk", "Avenir Next", sans-serif; }

    /* ---- 顶条 ---- */
    .studio-bar { display: flex; align-items: center; gap: 20px; height: 52px; border-bottom: 1px solid #ddd7cb; }
    .st-iconbtn { display: grid; place-items: center; flex: none; width: 34px; height: 34px; border: 1px solid #d3ccbd; border-radius: 10px; background: transparent; color: #211e19; font-size: 14px; line-height: 0; padding: 0; cursor: pointer; }
    .st-iconbtn svg { display: block; }
    .st-iconbtn:hover { border-color: var(--ac); color: var(--ac); }
    .studio-brand { font-family: "Space Grotesk", "Avenir Next", sans-serif; font-size: 11px; font-weight: 600; letter-spacing: .18em; color: #211e19; white-space: nowrap; }
    .studio-crumb { min-width: 0; flex: 1; margin: 0; color: #a49c8e; font-size: 10.5px; letter-spacing: .04em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .st-identity { display: flex; align-items: center; gap: 7px; color: #a49c8e; font-size: 10px; white-space: nowrap; }
    .st-identity select { max-width: 150px; border: 1px solid #d3ccbd; border-radius: 999px; background: transparent; color: #211e19; font-size: 11px; padding: 5px 12px; outline: none; cursor: pointer; appearance: none; }
    .st-identity select:focus { border-color: var(--ac); }
    .bar-link { border: 0; background: none; padding: 0; color: var(--ac); font-size: 11px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; cursor: pointer; white-space: nowrap; }
    .bar-link:hover { color: var(--ac-dark); }

    /* ---- 项目条 ---- */
    .proj-strip { display: flex; align-items: center; justify-content: space-between; gap: 26px; padding: 20px 0 16px; }
    .ps-title { margin: 0; max-width: none; color: #211e19; font-size: 21px; font-weight: 700; line-height: 1.3; letter-spacing: .01em; }
    .ps-sub { margin: 5px 0 0; color: #6e675d; font-size: 11px; line-height: 1.6; }
    .ps-sub .gk { color: #a49c8e; }
    .ps-side { display: flex; flex: none; align-items: center; gap: 16px; }
    .ps-progress { color: #211e19; font-family: "Space Grotesk", sans-serif; font-size: 13px; font-weight: 600; letter-spacing: .04em; white-space: nowrap; }
    .ps-progress i { font-style: normal; color: #a49c8e; }
    select.pill-select { appearance: none; border: 1px solid var(--ac); border-radius: 999px; background: transparent; color: var(--ac); font-size: 11px; font-weight: 700; padding: 6px 14px; outline: none; cursor: pointer; text-align: center; }
    select.pill-select:focus-visible { outline: 2px solid rgba(var(--ac-rgb), .35); outline-offset: 2px; }
    .people { display: flex; }
    .st-avatar { display: inline-grid; place-items: center; flex: none; width: 24px; height: 24px; border: 2px solid #f3f1ec; border-radius: 50%; color: #fff; font-size: 9px; font-weight: 700; font-style: normal; }
    .people .st-avatar + .st-avatar { margin-left: -6px; }
    .st-avatar.sm { width: 16px; height: 16px; border-width: 1px; font-size: 7.5px; }

    /* ---- 分区页签 ---- */
    .view-tabs { display: flex; gap: 24px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; border-bottom: 1px solid #ddd7cb; }
    .view-tabs::-webkit-scrollbar { display: none; }
    .view-tabs button { flex: none; border: 0; border-bottom: 2px solid transparent; background: none; padding: 2px 1px 11px; color: #6e675d; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
    .view-tabs button:hover { color: var(--ac); }
    .view-tabs button.active { color: #211e19; font-weight: 700; border-color: var(--ac); }
    .view-tabs .cnt { margin-left: 4px; color: #a49c8e; font-family: "Space Grotesk", sans-serif; font-size: 10px; }

    .collab-main { max-width: none; width: auto; margin: 0; min-width: 0; flex: 1; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; padding: 22px 0 26px; }
    #viewRoot { display: flex; flex: 1; min-height: 0; flex-direction: column; }

    /* ---- 状态点 ---- */
    .st-dot { display: inline-block; flex: none; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .st-word { display: inline-flex; align-items: center; gap: 6px; font: 600 9.5px/1 "IBM Plex Mono", "SFMono-Regular", Menlo, monospace; letter-spacing: .05em; white-space: nowrap; }
    .s-done { color: #2c7a52; }
    .s-doing { color: var(--ac); }
    .s-review { color: #a86a1f; }
    .s-todo { color: #a49c8e; }
    .s-none { color: #d6d0c2; }
    .who { display: inline-flex; align-items: center; gap: 6px; color: #6e675d; font-size: 10.5px; white-space: nowrap; }
    .who strong { color: #211e19; font-weight: 600; }
    .sec-legend { display: flex; align-items: center; gap: 14px; margin-left: auto; }
    .sec-legend .st-word { font-size: 9px; }

    /* ---- 圆角胶囊按钮 ---- */
    .pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #c9c1b1; border-radius: 999px; background: transparent; color: #211e19; font-size: 11.5px; font-weight: 500; padding: 7px 15px; cursor: pointer; white-space: nowrap; transition: border-color .15s, color .15s, background .15s; }
    .pill:hover { border-color: #211e19; }
    .pill.accent { border-color: var(--ac); color: var(--ac); }
    .pill.accent:hover { background: rgba(var(--ac-rgb), .07); }
    .pill.solid { border-color: var(--ac); background: var(--ac); color: #f6f4ef; }
    .pill.solid:hover { background: var(--ac-dark); }
    .pill.sm { padding: 4px 11px; font-size: 10.5px; }
    .pill .gk { font-size: 10px; color: inherit; opacity: .75; }
    .pill:focus-visible, .cell:focus-visible, .prod-chip:focus-visible, .g-card:focus-visible, .v-row:focus-visible, .ver-chip:focus-visible, .proj-card:focus-visible { outline: 2px solid rgba(var(--ac-rgb), .4); outline-offset: 2px; }
    .mini-link { border: 0; background: none; padding: 0; color: var(--ac); font: 500 10px/1.4 "IBM Plex Mono", Menlo, monospace; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; cursor: pointer; white-space: nowrap; }
    .mini-link:hover { color: var(--ac-dark); }

    /* ---- 场景：舞台 ---- */
    .stage-row { display: flex; gap: 44px; align-items: stretch; flex: 1; min-height: 0; }
    .stage-info { display: flex; flex: none; flex-direction: column; gap: 11px; width: clamp(340px, 24vw, 470px); padding-top: 6px; overflow-y: auto; }
    .k-scene { margin: 0; color: var(--ac); font-family: "Space Grotesk", sans-serif; font-size: 10.5px; font-weight: 600; letter-spacing: .22em; }
    .k-time { margin: 0; color: #211e19; font-family: "Space Grotesk", sans-serif; font-size: 29px; font-weight: 500; line-height: 1.05; letter-spacing: .01em; }
    .k-title { margin: 0; color: #211e19; font-size: 21px; font-weight: 700; letter-spacing: .01em; }
    .k-action { margin: 0; color: #55503f; font-size: 12.5px; line-height: 1.95; }
    .k-extra { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid #ddd7cb; padding-top: 12px; }
    .k-extra > div { display: flex; gap: 10px; }
    .k-extra b { flex: none; width: 30px; color: #211e19; font-size: 10.5px; font-weight: 700; }
    .k-extra span { color: #6e675d; font-size: 11px; line-height: 1.7; }
    .k-btns { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
    .stage-col { display: flex; flex: 1; min-width: 0; min-height: 0; flex-direction: column; gap: 10px; }
    .prod-chips, .stage-cap { flex: none; }
    .prod-chips { display: flex; gap: 8px; }
    .prod-chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid #c9c1b1; border-radius: 999px; background: transparent; color: #6e675d; font-size: 11px; font-weight: 500; padding: 6px 13px; cursor: pointer; }
    .prod-chip:hover { border-color: #211e19; color: #211e19; }
    .prod-chip.active { border-color: var(--ac); background: rgba(var(--ac-rgb), .08); color: #211e19; font-weight: 700; }
    .prod-chip.mk { border-style: dashed; }
    .stage { position: relative; width: 100%; flex: 1; min-height: 240px; border: 1px solid #d3ccbd; background: #e9e5db; overflow: hidden; box-shadow: 0 18px 44px rgba(60, 52, 38, .13); box-sizing: border-box; }
    .stage.is-item { cursor: pointer; }
    .stage img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .stage.is-video img { opacity: .8; }
    .stage-overlay { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); border: 1px solid rgba(33, 30, 25, .25); border-radius: 999px; background: rgba(246, 244, 239, .92); color: #211e19; font-size: 11px; font-weight: 600; padding: 8px 18px; white-space: nowrap; }
    .stage-doc { display: flex; flex-direction: column; gap: 10px; height: 100%; padding: 26px 30px; box-sizing: border-box; overflow-y: auto; background: #faf9f5; }
    .stage-doc > div { display: flex; gap: 12px; }
    .stage-doc b { flex: none; width: 32px; color: #211e19; font-size: 11px; font-weight: 700; padding-top: 1px; }
    .stage-doc span { color: #55503f; font-size: 12px; line-height: 1.85; }
    .stage-ph { display: flex; align-items: center; justify-content: center; height: 100%; color: #a49c8e; font-size: 11px; line-height: 1.7; text-align: center; padding: 20px; box-sizing: border-box; }
    .stage-cap { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .stage-cap-l { min-width: 0; color: #6e675d; font: 400 10px/1.5 "IBM Plex Mono", Menlo, monospace; letter-spacing: .03em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stage-cap-r { display: flex; flex: none; align-items: center; gap: 10px; }

    /* ---- 胶片条 ---- */
    .filmstrip { display: flex; flex: none; gap: 10px; overflow-x: auto; margin-top: 22px; padding-bottom: 4px; }
    .cell { display: flex; flex: 1 1 150px; max-width: 280px; flex-direction: column; gap: 6px; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; }
    .cell-thumb { width: 100%; aspect-ratio: 2.35 / 1; border: 1px solid #d3ccbd; box-sizing: border-box; background: #e9e5db; overflow: hidden; }
    .cell-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cell.active .cell-thumb { border: 2px solid var(--ac); }
    .cell-ph { display: flex; align-items: center; justify-content: center; height: 100%; border: 1px dashed #b8b0a0; box-sizing: border-box; background: #edeae2; color: #a49c8e; font-size: 9.5px; }
    .cell.active .cell-ph { border-style: solid; border-color: var(--ac); border-width: 2px; }
    .cell-cap { display: flex; align-items: center; gap: 6px; color: #6e675d; font: 400 9px/1.4 "IBM Plex Mono", Menlo, monospace; white-space: nowrap; overflow: hidden; }
    .cell-cap em { margin-left: auto; font-style: normal; font-family: "Space Grotesk", sans-serif; color: #a49c8e; }
    .cell.active .cell-cap, .cell.active .cell-cap em { color: var(--ac); }
    .cell.add { flex: 0 0 92px; }
    .cell.add .cell-thumb { display: flex; align-items: center; justify-content: center; border: 1px dashed #b8b0a0; background: none; color: #6e675d; font-size: 11px; }
    .cell.add:hover .cell-thumb { border-color: var(--ac); color: var(--ac); }
    .scene-add { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 14px; align-items: center; margin-top: 16px; border: 1px dashed #c9c1b1; border-radius: 12px; background: #f7f5f0; padding: 14px 16px; }
    .scene-add[hidden] { display: none; }

    .st-input { width: 100%; box-sizing: border-box; border: 1px solid #d3ccbd; border-radius: 9px; background: #faf9f5; color: #211e19; padding: 9px 12px; font-size: 12px; outline: none; transition: border-color .15s; }
    .st-input:focus { border-color: var(--ac); }
    .st-input::placeholder { color: #a49c8e; }
    select.st-input { cursor: pointer; }

    /* ---- 脚本 ---- */
    .doc-head { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding-bottom: 16px; border-bottom: 1px solid #ddd7cb; cursor: pointer; }
    .doc-head h2 { margin: 0; color: #211e19; font-size: 18px; font-weight: 700; }
    .doc-head:hover h2 { color: var(--ac); }
    .byline-mono { color: #a49c8e; font: 400 9.5px/1.5 "IBM Plex Mono", Menlo, monospace; letter-spacing: .03em; }
    .screenplay { margin: 0; padding: 0; list-style: none; }
    .sp-scene { display: grid; grid-template-columns: 118px minmax(0, 1fr); gap: 22px; padding: 18px 0; border-bottom: 1px solid #e2ddd1; }
    .sp-tc { margin: 0; color: var(--ac); font-family: "Space Grotesk", sans-serif; font-size: 11px; font-weight: 600; line-height: 1.7; }
    .sp-tc em { display: block; font-style: normal; color: #a49c8e; font-weight: 400; font-size: 10px; }
    .sp-scene h3 { margin: 0 0 8px; color: #211e19; font-size: 14.5px; font-weight: 700; }
    .sp-row { margin: 0 0 6px; color: #55503f; font-size: 12px; line-height: 1.85; }
    .sp-row:last-child { margin-bottom: 0; }
    .sp-row b { display: inline-block; min-width: 44px; color: #211e19; font-weight: 700; }
    .sp-sources { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 18px 0 0; padding: 0; list-style: none; }
    .sp-sources a { color: #6e675d; font: 400 10px/1.5 "IBM Plex Mono", Menlo, monospace; text-decoration-color: #b8b0a0; text-underline-offset: 3px; }
    .sp-sources a:hover { color: var(--ac); }

    /* ---- 图片 ---- */
    .view-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px; }
    .view-head h2 { margin: 0; color: #211e19; font-size: 16px; font-weight: 700; }
    .view-head .gk { color: #a49c8e; font-size: 10px; letter-spacing: .16em; }
    .gal { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 26px 24px; }
    .g-card { margin: 0; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; }
    .g-thumb { width: 100%; aspect-ratio: 16 / 9; border: 1px solid #d3ccbd; box-sizing: border-box; background: #e9e5db; overflow: hidden; }
    .g-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .g-card.selected .g-thumb { border: 2px solid var(--ac); }
    .g-ph { display: flex; align-items: center; justify-content: center; height: 100%; border: 1px dashed #b8b0a0; box-sizing: border-box; background: #edeae2; color: #a49c8e; font-size: 10px; }
    .g-cap { display: flex; flex-direction: column; gap: 4px; margin-top: 9px; }
    .g-cap1 { color: #a49c8e; font: 400 9px/1.4 "IBM Plex Mono", Menlo, monospace; letter-spacing: .05em; }
    .g-cap2 { color: #211e19; font-size: 13px; font-weight: 700; }
    .g-card:hover .g-cap2 { color: var(--ac); }
    .g-cap3 { display: flex; align-items: center; gap: 12px; margin-top: 1px; }

    /* ---- 视频片段 ---- */
    .v-rows { display: flex; flex-direction: column; }
    .v-row { display: flex; align-items: center; gap: 16px; width: 100%; border: 0; border-bottom: 1px solid #e2ddd1; background: none; padding: 12px 0; text-align: left; cursor: pointer; }
    .v-thumb { flex: none; width: 96px; aspect-ratio: 16 / 9; border: 1px solid #d3ccbd; box-sizing: border-box; background: #e9e5db; overflow: hidden; }
    .v-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: .85; }
    .v-thumb .g-ph { font-size: 8.5px; }
    .v-no { flex: none; width: 34px; color: var(--ac); font-family: "Space Grotesk", sans-serif; font-size: 11px; font-weight: 600; }
    .v-main { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .v-title { color: #211e19; font-size: 13px; font-weight: 700; }
    .v-row:hover .v-title, .v-row.selected .v-title { color: var(--ac); }
    .v-sub { color: #a49c8e; font: 400 9px/1.4 "IBM Plex Mono", Menlo, monospace; }
    .v-row .st-word { margin-left: auto; }

    /* ---- 文案版本 ---- */
    .copy-wrap { max-width: 780px; }
    .ver-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .ver-chip { border: 1px solid #c9c1b1; border-radius: 999px; background: transparent; color: #6e675d; font-size: 10.5px; font-weight: 600; padding: 5px 13px; cursor: pointer; }
    .ver-chip:hover { border-color: #211e19; color: #211e19; }
    .ver-chip.cur { border-color: var(--ac); color: var(--ac); }
    .ver-chip.viewing { background: rgba(var(--ac-rgb), .1); border-color: var(--ac); color: var(--ac-dark); }
    .copy-page { margin-top: 14px; border: 1px solid #d3ccbd; background: #faf9f5; padding: 24px 28px; color: #3c382c; font-size: 12.5px; line-height: 2; white-space: pre-wrap; word-break: break-word; box-shadow: 0 12px 30px rgba(60, 52, 38, .08); }
    .copy-caption { margin: 9px 0 0; color: #a49c8e; font: 400 9px/1.6 "IBM Plex Mono", Menlo, monospace; letter-spacing: .04em; }
    .copy-new { display: grid; gap: 12px; margin-top: 22px; padding-top: 18px; border-top: 1px solid #ddd7cb; }
    .copy-new textarea, .cm-form textarea { width: 100%; box-sizing: border-box; border: 1px solid #d3ccbd; border-radius: 9px; background: #faf9f5; padding: 10px 12px; color: #211e19; font-size: 11.5px; line-height: 1.75; outline: none; }
    .copy-new textarea:focus, .cm-form textarea:focus { border-color: var(--ac); }
    .copy-new textarea { min-height: 92px; }
    .copy-new .pill { justify-self: start; }

    .ws-empty { border: 1px dashed #b8b0a0; border-radius: 12px; background: #f7f5f0; padding: 24px 28px; color: #55503f; font-size: 12px; line-height: 1.85; }
    .ws-empty h2 { margin: 0 0 6px; color: #211e19; font-size: 14.5px; font-weight: 700; }
    .topic-help { margin: 12px 0 0; color: #a49c8e; font-size: 10px; line-height: 1.75; }

    /* ---- 左抽屉：项目 / 选题库 ---- */
    .side-panel { position: fixed; top: 0; left: 0; bottom: 0; z-index: 75; display: flex; flex-direction: column; gap: 16px; width: min(340px, 88vw); overflow-y: auto; background: #f6f4ef; border-right: 1px solid #d3ccbd; box-shadow: 18px 0 44px rgba(37, 33, 24, .2); padding: 22px 20px 24px; transform: translateX(-105%); transition: transform .22s ease; }
    .side-fold { border-top: 1px solid #e2ddd1; }

    .proj-rows { display: flex; flex-direction: column; gap: 8px; }
    .proj-card { display: flex; flex-direction: column; gap: 7px; width: 100%; border: 1px solid #d3ccbd; border-radius: 12px; background: #faf9f5; padding: 12px 13px; text-align: left; cursor: pointer; transition: border-color .15s; }

    .proj-card.active { border: 1.5px solid var(--ac); }
    .proj-topic { color: #a49c8e; font: 400 9px/1.4 "IBM Plex Mono", Menlo, monospace; letter-spacing: .05em; }
    .proj-card strong { color: #211e19; font-size: 13px; font-weight: 700; line-height: 1.4; }
    .proj-bar { display: block; height: 3px; border-radius: 99px; background: #e2ddd1; overflow: hidden; }
    .proj-bar i { display: block; height: 100%; border-radius: 99px; background: var(--ac); }
    .proj-foot { color: #a49c8e; font: 400 9px/1.5 "IBM Plex Mono", Menlo, monospace; }
    .side-panel .st-input { margin-bottom: 9px; }
    .side-panel .pill { align-self: flex-start; }
    .side-foot { margin-top: auto; padding-top: 14px; border-top: 1px solid #e2ddd1; display: flex; flex-direction: column; gap: 7px; }
    .crew-lines { margin: 0; color: #8a8272; font-size: 10.5px; line-height: 1.7; }
    .st-linkbtn { border: 0; background: none; padding: 0; width: fit-content; color: #a49c8e; font: 400 9.5px/1.5 "IBM Plex Mono", Menlo, monospace; text-decoration: underline dashed; text-underline-offset: 3px; cursor: pointer; }

    /* ---- 右抽屉：详情 ---- */
    .inspector-panel { position: fixed; top: 0; right: 0; bottom: 0; z-index: 75; width: min(430px, 94vw); overflow-y: auto; background: #f6f4ef; border-left: 1px solid #d3ccbd; box-shadow: -18px 0 44px rgba(37, 33, 24, .2); padding: 20px 20px 44px; transform: translateX(105%); transition: transform .22s ease; box-sizing: border-box; }
    body.drawer-open .inspector-panel { transform: none; }
    .ins-cap { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #ddd7cb; padding-bottom: 12px; }
    .ins-cap p { margin: 0; color: #6e675d; font: 500 9.5px/1 "IBM Plex Mono", Menlo, monospace; letter-spacing: .16em; }
    .ins-close { display: grid; place-items: center; flex: none; margin-left: auto; width: 28px; height: 28px; border: 1px solid #d3ccbd; border-radius: 999px; background: transparent; color: #6e675d; font-size: 14px; cursor: pointer; }

    .ins-title { margin: 14px 0 0; color: #211e19; font-size: 17px; font-weight: 700; line-height: 1.45; }
    .ins-desc { margin: 6px 0 0; color: #6e675d; font-size: 11px; line-height: 1.75; }
    .ins-preview { margin: 12px 0 0; position: relative; }
    .ins-preview img { display: block; width: 100%; max-height: 200px; object-fit: cover; border: 1px solid #d3ccbd; box-sizing: border-box; }
    .ins-preview .ph { display: flex; align-items: center; justify-content: center; min-height: 96px; border: 1px dashed #b8b0a0; background: #edeae2; padding: 14px; color: #a49c8e; font-size: 10.5px; line-height: 1.7; text-align: center; }
    .ins-badge { display: inline-block; margin: 8px 0 0; color: var(--ac); font: 500 9px/1.5 "IBM Plex Mono", Menlo, monospace; letter-spacing: .05em; }
    .ins-rows { margin-top: 12px; }
    .ins-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid #e2ddd1; }
    .ins-row > span:first-child { color: #a49c8e; font: 400 9px/1.4 "IBM Plex Mono", Menlo, monospace; letter-spacing: .1em; }
    .ins-row strong { color: #211e19; font-size: 11px; font-weight: 600; text-align: right; }
    .ins-row select { border: 1px solid #d3ccbd; border-radius: 999px; background: transparent; color: #211e19; font-size: 10.5px; padding: 4px 11px; outline: none; cursor: pointer; appearance: none; }
    .ins-row select:focus { border-color: var(--ac); }
    .ins-sec { margin-top: 18px; }
    .ins-sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .ins-sec-head h4 { margin: 0; color: #211e19; font-size: 11.5px; font-weight: 700; }
    .ins-sec-head h4 .gk { color: #a49c8e; font-size: 9.5px; font-weight: 500; margin-left: 4px; }
    .ins-pre { margin: 0; border: 1px solid #ddd7cb; border-radius: 6px; background: #edeae2; padding: 12px 14px; color: #46412f; font: 400 10px/1.85 "IBM Plex Mono", Menlo, monospace; white-space: pre-wrap; word-break: break-word; }
    .ver-list { margin: 0; padding: 0; list-style: none; }
    .ver-item { display: block; width: 100%; border: 0; border-bottom: 1px solid #e2ddd1; background: none; padding: 8px 0; color: #55503f; font-size: 10.5px; line-height: 1.65; text-align: left; }
    button.ver-item { cursor: pointer; }
    button.ver-item:hover { color: var(--ac); }
    .ver-item.viewing { background: rgba(var(--ac-rgb), .07); }
    .ver-tag { margin-right: 7px; color: var(--ac); font-family: "Space Grotesk", sans-serif; font-size: 10.5px; font-weight: 600; }
    .ver-meta { display: block; margin-top: 2px; color: #a49c8e; font: 400 8.5px/1.5 "IBM Plex Mono", Menlo, monospace; letter-spacing: .03em; }
    .cm-list { display: flex; flex-direction: column; gap: 10px; }
    .cm-item { display: flex; gap: 8px; }
    .cm-head { color: #a49c8e; font-size: 10px; }
    .cm-head strong { color: #211e19; font-weight: 700; font-size: 10.5px; }
    .cm-item p { margin: 3px 0 0; color: #4c473a; font-size: 10.5px; line-height: 1.7; }
    .cm-sys { margin: 0; padding-left: 24px; color: #a49c8e; font: 400 9px/1.6 "IBM Plex Mono", Menlo, monospace; }
    .cm-sys strong { color: #6e675d; font-weight: 500; }
    .cm-form { display: grid; gap: 10px; margin-top: 12px; }
    .cm-form textarea { min-height: 58px; }
    .cm-form .pill { justify-self: end; }

    .st-scrim { position: fixed; inset: 0; z-index: 70; background: rgba(33, 29, 21, .38); }
    .st-scrim[hidden] { display: none; }

    /* ---- 生成工作流：提示词编辑 / 模型库 / 版本登记与删除 ---- */
    .ins-row input[type="text"] { width: 178px; border: 1px solid #d3ccbd; border-radius: 8px; background: #faf9f5; color: #211e19; font-size: 10.5px; padding: 4px 9px; text-align: right; outline: none; }
    .ins-row input[type="text"]:focus { border-color: var(--ac); }
    .prompt-edit { display: grid; gap: 9px; }
    .prompt-edit textarea { width: 100%; box-sizing: border-box; min-height: 150px; border: 1px solid #d3ccbd; border-radius: 6px; background: #faf9f5; padding: 11px 13px; color: #46412f; font: 400 10px/1.85 "IBM Plex Mono", Menlo, monospace; outline: none; resize: vertical; }
    .prompt-edit textarea:focus { border-color: var(--ac); }
    .prompt-edit .row { display: flex; gap: 8px; justify-content: flex-end; }
    .pill.sm.solid { background: var(--ac); border-color: var(--ac); color: #f6f4ef; }
    .ver-line { color: #55503f; font-size: 10.5px; line-height: 1.6; }
    .ver-actions { display: inline-flex; gap: 10px; margin-left: 8px; }
    .ver-del:hover { color: #a5482f; }
    .ver-form { display: grid; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed #ddd7cb; }
    .ver-form .pill { justify-self: start; }
    .ins-danger { margin-top: 24px; border-top: 1px dashed #ddd7cb; padding-top: 12px; }
    .st-linkbtn.danger:hover { color: #a5482f; }
    .stage video { display: block; width: 100%; height: 100%; object-fit: contain; background: #1c1a15; }
    .ins-preview video { display: block; width: 100%; max-height: 220px; object-fit: contain; background: #1c1a15; }
    .mk-kind { margin: 8px 0 6px; color: #a49c8e; font: 500 9px/1 "IBM Plex Mono", Menlo, monospace; letter-spacing: .14em; }
    .mk-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .mk-chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid #d3ccbd; border-radius: 999px; background: #faf9f5; color: #55503f; font-size: 10.5px; padding: 4px 8px 4px 11px; }
    .mk-chip button { border: 0; background: none; padding: 0; color: #a49c8e; font-size: 11px; line-height: 1; cursor: pointer; opacity: .3; transition: opacity .12s; }
    .mk-chip:hover button, .mk-chip button:focus-visible { opacity: 1; }
    .mk-chip button:hover { color: #a5482f; }
    .mk-add { display: grid; grid-template-columns: 82px minmax(0, 1fr) auto; gap: 8px; align-items: center; margin-top: 12px; }
    .mk-add .st-input { margin-bottom: 0; }
    /* ---- 控件规格统一：覆盖 font:inherit 带来的 16px 默认字号 ---- */
    input.st-input, select.st-input, textarea.st-input { font-size: 12px; }
    .side-panel .st-input { font-size: 11.5px; padding: 8px 11px; border-radius: 8px; margin-bottom: 8px; height: auto; }
    .side-panel select.st-input { height: 34px; padding: 0 11px; }
    .fold-body .pill.solid { font-size: 11.5px; padding: 8px 16px; }
    .mk-add { grid-template-columns: 76px minmax(0, 1fr) auto; }
    .mk-add .st-input, .mk-add select.st-input { margin-bottom: 0; height: 32px; padding: 0 10px; font-size: 11px; box-sizing: border-box; }
    .mk-add .pill.sm { height: 32px; padding: 0 13px; font-size: 10.5px; box-sizing: border-box; }
    .scene-add .st-input { font-size: 12px; height: 36px; padding: 0 12px; box-sizing: border-box; }
    .copy-new input.st-input { font-size: 12px; }
    .ver-form .st-input { font-size: 11px; padding: 7px 10px; }
    /* ---- 详情抽屉分页（详情/生成/版本/评论，降低滚动负担） ---- */
    .ins-byline { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 9px; }
    .ins-tabs { display: flex; gap: 6px; margin-top: 14px; }
    .ins-tabs button { flex: 1; min-width: 0; border: 1px solid #d3ccbd; border-radius: 999px; background: transparent; color: #6e675d; font-size: 11px; padding: 6px 2px; cursor: pointer; white-space: nowrap; }
    .ins-tabs button:hover { border-color: #211e19; color: #211e19; }
    .ins-tabs button.active { border-color: var(--ac); background: rgba(var(--ac-rgb), .08); color: #211e19; font-weight: 700; }
    .ins-tabs .gk { font-size: 9px; margin-left: 3px; color: #a49c8e; }
    .ins-pane { margin-top: 15px; }
    .ins-pane .ins-preview { margin-top: 0; }
    .ins-pane .ins-danger { margin-top: 20px; }
    /* ---- 下拉框统一自绘箭头：左右间距对称 ---- */
    select.st-input, .ins-row select, .st-identity select, select.pill-select {
      appearance: none; -webkit-appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='10'%20height='10'%20fill='none'%20stroke='%236e675d'%20stroke-width='1.5'%3E%3Cpath%20d='M2%203.5%20L5%206.5%20L8%203.5'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 11px center;
      background-size: 10px 10px;
      padding-right: 30px;
    }
    .side-panel select.st-input { padding-right: 30px; }
    .ins-row select { background-position: right 9px center; padding-right: 26px; }
    .mk-add select.st-input { background-position: right 8px center; padding-right: 25px; }
    select.pill-select { background-image: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='10'%20height='10'%20fill='none'%20stroke='%234a4842'%20stroke-width='1.5'%3E%3Cpath%20d='M2%203.5%20L5%206.5%20L8%203.5'/%3E%3C/svg%3E"); background-position: right 12px center; padding: 6px 30px 6px 14px; text-align: left; }
    /* ---- 项目卡片：压扁 + 悬停删除（两次点击确认） ---- */
    .proj-rows { gap: 6px; }
    .proj-card { gap: 5px; border-radius: 10px; padding: 9px 11px; }
    .proj-line { display: flex; align-items: center; gap: 8px; }
    .proj-card strong { flex: 1; min-width: 0; margin: 0; font-size: 12.5px; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .proj-del { flex: none; border: 0; border-radius: 6px; background: none; padding: 1px 4px; color: #a49c8e; font-size: 13px; line-height: 1.2; cursor: pointer; opacity: 0; transition: opacity .12s, color .12s; }
    .proj-card:hover .proj-del, .proj-del:focus-visible, .proj-del[data-armed] { opacity: 1; }
    .proj-del:hover { color: #a5482f; }
    .proj-del[data-armed] { opacity: 1; color: #a5482f; background: rgba(165, 72, 47, .1); font-size: 10px; font-weight: 700; padding: 3px 7px; }
    .proj-meta { color: #a49c8e; font: 400 9px/1.4 "IBM Plex Mono", Menlo, monospace; letter-spacing: .03em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .proj-bar { height: 2px; }
    .fold-label { display: block; margin: 3px 2px 6px; color: #a49c8e; font-size: 10px; line-height: 1.5; }
    /* ---- 拉丝钢金属填充：仅用于填充面（按钮 / 进度条），文字与描边仍用实色 ---- */
    .pill.solid, .back-to-studio {
      border-color: var(--ac-edge);
      background-color: var(--ac);
      background-image: var(--ac-brush), var(--ac-metal);
      background-blend-mode: overlay, normal;
      color: #f7f6f2;
      box-shadow: inset 0 1px 0 var(--ac-hi), inset 0 -1px 0 rgba(0,0,0,.34), 0 1px 2px rgba(40,34,24,.18);
      text-shadow: 0 1px 0 rgba(0,0,0,.28);
    }
    .pill.solid:hover, .back-to-studio:hover { background-image: var(--ac-brush), var(--ac-metal-hover); }
    .pill.solid:active { box-shadow: inset 0 2px 4px rgba(0,0,0,.34); }
    .proj-bar i { background: var(--ac-sheen); }
    /* ---- AI 流水线 + 资产库 ---- */
    .pipe-steps { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 6px; }
    .pipe-step { display: inline-flex; align-items: center; gap: 7px; border: 1px solid #d3ccbd; border-radius: 999px; background: transparent; color: #6e675d; font-size: 11px; padding: 6px 13px; cursor: pointer; }
    .pipe-step.done { color: #2c7a52; border-color: #bcd3c5; }
    .pipe-step.active { border-color: var(--ac); background: rgba(var(--ac-rgb), .08); color: #211e19; font-weight: 700; }
    .pipe-step.todo { cursor: default; opacity: .65; }
    .pipe-pane { max-width: 880px; }
    .pipe-block { border: 1px solid #ddd7cb; background: #faf9f5; padding: 18px 20px 16px; margin-top: 14px; }
    .pipe-block h3 { margin: 0 0 6px; font-size: 14px; font-weight: 700; }
    .pipe-sub { margin: 0 0 12px; color: #6e675d; font-size: 11.5px; line-height: 1.75; }
    .pipe-ta { width: 100%; box-sizing: border-box; min-height: 190px; border: 1px solid #d3ccbd; border-radius: 6px; background: #fff; padding: 13px 15px; color: #2f2b22; font-size: 12.5px; line-height: 2; outline: none; resize: vertical; }
    .pipe-ta:focus { border-color: var(--ac); }
    .pipe-in { width: 100%; box-sizing: border-box; border: 1px solid #d3ccbd; border-radius: 6px; background: #fff; padding: 10px 12px; font-size: 12.5px; outline: none; }
    .pipe-in:focus { border-color: var(--ac); }
    .pipe-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 13px; }
    .pipe-hint { color: #a49c8e; font-size: 10.5px; line-height: 1.7; }
    .pipe-err { color: #a5482f; font-size: 11px; line-height: 1.7; }
    .spin { display: inline-block; width: 11px; height: 11px; border: 2px solid rgba(var(--ac-rgb), .25); border-top-color: var(--ac); border-radius: 50%; animation: pipespin .7s linear infinite; vertical-align: -2px; }
    @keyframes pipespin { to { transform: rotate(360deg); } }
    .cand { display: block; width: 100%; border: 1px solid #ddd7cb; background: #fff; text-align: left; padding: 10px 13px; margin-top: 8px; cursor: pointer; }
    .cand:hover { border-color: var(--ac); }
    .cand b { display: block; font-size: 12.5px; }
    .cand span { color: #6e675d; font-size: 10.5px; }
    .bk-cols { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; margin-top: 12px; }
    .bk-list { border: 1px solid #e2ddd1; background: #fff; padding: 10px 13px; max-height: 380px; overflow-y: auto; }
    .bk-list h4 { margin: 0 0 7px; font-size: 11.5px; font-weight: 700; }
    .bk-row { padding: 7px 0; border-top: 1px solid #eee9df; font-size: 11px; color: #55503f; line-height: 1.7; }
    .bk-row b { color: #211e19; }
    .bk-refs { color: var(--ac); font: 500 9.5px/1.5 "IBM Plex Mono", Menlo, monospace; }
    .gen-rows { display: flex; flex-direction: column; margin-top: 6px; }
    .gen-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid #eee9df; }
    .gen-thumb { flex: none; width: 76px; height: 43px; border: 1px solid #d3ccbd; background: #e9e5db; overflow: hidden; }
    .gen-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .gen-thumb .ph2 { display: grid; place-items: center; height: 100%; color: #a49c8e; font-size: 9px; }
    .gen-main { flex: 1; min-width: 0; }
    .gen-main b { display: block; font-size: 12px; }
    .gen-main span { color: #a49c8e; font: 400 9px/1.5 "IBM Plex Mono", Menlo, monospace; }
    .gen-row .pill.sm { flex: none; }
    .asset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; margin-top: 14px; }
    .asset-card { border: 1px solid #ddd7cb; background: #faf9f5; padding: 10px; }
    .asset-card .g-thumb { display: block; margin-bottom: 8px; }
    .asset-kind { color: var(--ac); font: 600 9px/1 "IBM Plex Mono", Menlo, monospace; letter-spacing: .12em; }
    .asset-card h4 { margin: 4px 0 2px; font-size: 12.5px; font-weight: 700; }
    .asset-card .rk { color: #a49c8e; font: 400 9px/1.4 "IBM Plex Mono", Menlo, monospace; }
    .asset-foot { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .asset-files { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .asset-files button { padding: 0; border: 2px solid transparent; background: none; cursor: pointer; }
    .asset-files img { width: 52px; height: 30px; object-fit: cover; display: block; border: 1px solid #d3ccbd; }
    .asset-files button.primary { border-color: var(--ac); }
    .asset-expand { border-top: 1px dashed #ddd7cb; margin-top: 9px; padding-top: 9px; }
    @media (max-width: 1180px) {
      .collab-shell { padding: 0 28px; }
      .stage-info { width: 320px; }
      .gal { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 1024px) {
      .collab-shell { height: auto; min-height: 100vh; padding-bottom: 60px; }

      .stage-row { flex-direction: column; gap: 22px; flex: none; }
      .stage { flex: none; aspect-ratio: 2.39 / 1; min-height: 0; }
      .stage-info { width: auto; padding-top: 0; order: 2; overflow: visible; }

    }
    @media (max-width: 920px) {

      .ps-title { font-size: 18px; }

      .gal { grid-template-columns: 1fr; }
      .scene-add { grid-template-columns: 1fr; }
      .v-row { flex-wrap: wrap; gap: 8px 12px; }
      .v-row .st-word { margin-left: 46px; }
      .sp-scene { grid-template-columns: 1fr; gap: 6px; }
      .view-tabs { gap: 18px; }
    }
    /* ---- 云端版：连接/登录门、提示条、个人资料、文件行 ---- */
    .gate { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: #f3f1ec; padding: 20px; }
    .gate[hidden] { display: none; }
    .gate-card { width: min(430px, 100%); box-sizing: border-box; border: 1px solid #d3ccbd; background: #faf9f5; box-shadow: 0 24px 60px rgba(60, 52, 38, .14); padding: 34px 34px 28px; display: flex; flex-direction: column; gap: 13px; }
    .gate-brand { font-family: "Space Grotesk", "Avenir Next", sans-serif; font-size: 11px; font-weight: 600; letter-spacing: .2em; color: var(--ac); }
    .gate-card h1 { margin: 0; max-width: none; color: #211e19; font-size: 21px; font-weight: 700; line-height: 1.3; letter-spacing: .01em; }
    .gate-sub { margin: 0; color: #6e675d; font-size: 11.5px; line-height: 1.85; }
    .gate-card .st-input { margin: 0; font-size: 13px; padding: 10px 12px; height: auto; }
    .gate-actions { display: flex; gap: 10px; margin-top: 2px; }
    .gate-err { margin: 0; color: #a5482f; font-size: 11px; line-height: 1.6; min-height: 17px; }
    .gate-foot { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-top: 2px; }
    .bar-user { display: inline-flex; align-items: center; gap: 8px; color: #55503f; font-size: 11px; white-space: nowrap; }
    .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 120; max-width: min(560px, 90vw); background: #211e19; color: #f6f4ef; font-size: 11.5px; line-height: 1.6; padding: 10px 18px; border-radius: 999px; box-shadow: 0 14px 34px rgba(33, 29, 21, .3); }
    .toast[hidden] { display: none; }
    .st-avatar.has-img { background: #e9e5db; }
    .st-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
    .me-avatar { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .me-av-preview { width: 34px; height: 34px; flex: none; border-radius: 50%; display: inline-grid; place-items: center; overflow: hidden; color: #fff; font-size: 12.5px; font-weight: 700; }
    .me-av-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .me-avatar .pill { flex: none; height: 30px; padding: 0 13px; font-size: 11px; line-height: 1; display: inline-flex; align-items: center; }
    .me-avatar .st-linkbtn { flex: none; margin-left: auto; }
    .me-row { display: grid; grid-template-columns: minmax(0, 1fr) 108px; gap: 8px; }
    .me-row .st-input { margin-bottom: 0; }
    .file-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .file-name { flex: 1; min-width: 0; color: #a49c8e; font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ver-dl:hover { color: var(--ac-dark); }
  </style>
</head>
<body class="collab-mode">
  <section class="collab-shell" aria-label="AI 视频协作工作台 · 云端版">
    <header class="studio-bar">
      <button class="st-iconbtn" type="button" id="navToggle" aria-label="打开项目与选题库"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/></svg></button>
      <span class="studio-brand">ORBIT STUDIO</span>
      <p class="studio-crumb" id="crumb"></p>
      <span class="bar-user" id="barUser"></span>
    </header>
    <div id="projectHead"></div>
    <nav class="view-tabs" id="viewTabs" aria-label="项目内容分区"></nav>
    <main class="collab-main" id="mainCol" aria-live="polite">
      <section id="viewRoot"></section>
    </main>
  </section>
  <aside class="side-panel" id="sidePanel" aria-label="项目与选题库">
    <section aria-label="项目">
      <p class="side-cap">项目 <span id="projCount"></span></p>
      <div class="proj-rows" id="projectList"></div>
    </section>
    <details class="side-fold" aria-label="新建项目" open>
      <summary>新建项目<span class="fold-hint">42 个主题</span></summary>
      <div class="fold-body">
        <input class="st-input" id="newProjectName" type="text" placeholder="项目名称（留空按主题自动命名）" autocomplete="off" />
        <label class="fold-label" for="topicSelect">选题主题（参考 · 用于预填脚本提示词）</label>
        <select class="st-input" id="topicSelect" aria-label="选题主题"></select>
        <button class="pill solid" type="button" id="createProjectBtn">新建项目</button>
      </div>
    </details>
    <details class="side-fold" aria-label="模型库">
      <summary>模型库<span class="fold-hint" id="modelCount"></span></summary>
      <div class="fold-body">
        <div id="modelGroups"></div>
        <form class="mk-add" id="modelAddForm">
          <select class="st-input" name="kind" aria-label="模型类型"><option value="text">文本</option><option value="image">图片</option><option value="video">视频</option></select>
          <input class="st-input" name="name" placeholder="模型名称" autocomplete="off" />
          <button class="pill sm" type="submit">添加</button>
        </form>
        <p class="topic-help">新任务默认用该类型的第一个模型。</p>
      </div>
    </details>
    <div class="side-foot">
      <p class="side-cap">我的资料</p>
      <div class="me-avatar">
        <span class="me-av-preview" id="meAvatarPreview"></span>
        <input type="file" id="meAvatarFile" accept="image/png,image/jpeg,image/webp,image/gif" hidden />
        <button class="pill sm" type="button" id="meAvatarBtn">上传头像</button>
        <button class="st-linkbtn" type="button" id="meAvatarClear" hidden>移除</button>
      </div>
      <div class="me-row">
        <input class="st-input" id="meName" placeholder="显示名" autocomplete="off" />
        <select class="st-input" id="meRole" aria-label="我的分工"><option value="script">脚本 / 统筹</option><option value="visual">图像生成</option><option value="video">视频生成</option></select>
      </div>
      <p class="crew-lines" id="crewLines"></p>
      <button class="st-linkbtn" type="button" id="logoutBtn">退出登录</button>
    </div>
  </aside>
  <aside class="inspector-panel" id="inspector" aria-label="内容详情"></aside>
  <div class="st-scrim" id="stScrim" hidden></div>
  <div class="gate" id="gate"><div class="gate-card" id="gateCard"></div></div>
  <div class="toast" id="toast" hidden></div>

          el('cfgSaveBtn').addEventListener('click', () => {
            const url = el('cfgUrl').value.trim().replace(/\/+$/, '');
            const key = el('cfgKey').value.trim();
            if (!/^https:\/\/.+\.supabase\.co$/.test(url)) { el('gateErr').textContent = 'Project URL 看起来不对，应形如 https://xxxx.supabase.co'; return; }
            if (key.length < 40) { el('gateErr').textContent = 'anon key 看起来不完整，请重新复制'; return; }
            saveConfig({ url, anonKey: key });
            if (initClient()) renderGate('login');
          });
          return;
        }
        // login
        gateCard.innerHTML = `
          <span class="gate-brand">ORBIT STUDIO</span>
          <h1>登录</h1>
          <p class="gate-sub">用团队约定的邮箱登录；第一次使用点「注册新账号」。</p>
          <form id="loginForm" autocomplete="on">
            <input class="st-input" id="authEmail" name="username" type="email" placeholder="邮箱" autocomplete="username" required />
            <input class="st-input" id="authPass" name="password" type="password" placeholder="密码（至少 6 位）" autocomplete="current-password" required />
            <p class="gate-err" id="gateErr">${esc(msg || '')}</p>
            <div class="gate-actions">
              <button class="pill solid" type="submit" id="loginBtn">登录</button>
              <button class="pill" type="button" id="signupBtn">注册新账号</button>
            </div>
          </form>
`;
        const err = t => { el('gateErr').textContent = t; };
        const creds = () => ({ email: el('authEmail').value.trim(), password: el('authPass').value });
        const LAST_EMAIL_KEY = 'orbitLastEmail_v1';
        try { el('authEmail').value = localStorage.getItem(LAST_EMAIL_KEY) || ''; } catch (e) {}
        el('loginForm').addEventListener('submit', async e => {
          e.preventDefault();
          const c = creds();
          if (!c.email || !c.password) { err('请填写邮箱和密码'); return; }
          el('loginBtn').textContent = '登录中…';
          const { data, error } = await sb.auth.signInWithPassword(c);
          el('loginBtn').textContent = '登录';
          if (error) { err('登录失败：' + error.message); return; }
          try { localStorage.setItem(LAST_EMAIL_KEY, c.email); } catch (e2) {}
          renderGate('loading');
          boot(data.session);
        });
        el('signupBtn').addEventListener('click', async () => {
          const c = creds();
          if (!c.email || c.password.length < 6) { err('请填写邮箱和至少 6 位密码'); return; }
          el('signupBtn').textContent = '注册中…';
          const { data, error } = await sb.auth.signUp(c);
          el('signupBtn').textContent = '注册新账号';
          if (error) { err('注册失败：' + error.message); return; }
          if (data.session) { renderGate('loading'); boot(data.session); }
          else err('账号已创建，请直接点「登录」。');
        });
        const cfgResetBtn = el('cfgResetBtn');
        if (cfgResetBtn) cfgResetBtn.addEventListener('click', () => { localStorage.removeItem(CONFIG_KEY); renderGate('setup'); });
      }

      /* ---------- 云端读取 ---------- */
      async function loadAll() {
        const q = [
          sb.from('profiles').select('*'),
          sb.from('models').select('*').order('created_at'),
          sb.from('projects').select('*').order('created_at'),
          sb.from('project_members').select('*'),
          sb.from('scenes').select('*').order('position'),
          sb.from('items').select('*').order('created_at'),
          sb.from('item_versions').select('*').order('v'),
          sb.from('comments').select('*').order('created_at'),
          sb.from('assets').select('*').order('created_at'),
          sb.from('asset_files').select('*').order('created_at'),
          sb.from('scene_assets').select('*'),
          sb.from('jobs').select('*').order('created_at', { ascending: false }).limit(120)
        ];
        const [pr, mo, pj, pm, sc, it, vs, cm, ass, af, sa, jb] = await Promise.all(q);
        const bad = [pr, mo, pj, pm, sc, it, vs, cm, ass, af, sa, jb].find(r => r.error);
        if (bad) { toast('读取失败：' + bad.error.message + '（是否已执行全部数据库脚本？）'); return false; }
        const avatarPaths = pr.data.filter(u => u.avatar_path).map(u => u.avatar_path);
        const storagePath = f => f && !/^https?:/.test(f);
        const paths = [...new Set([
          ...vs.data.filter(v => storagePath(v.file_path)).map(v => v.file_path),
          ...af.data.filter(f => storagePath(f.file_path)).map(f => f.file_path),
          ...avatarPaths
        ])];
        const urlMap = {};
        if (paths.length) {
          const { data: signed, error: se } = await sb.storage.from('assets').createSignedUrls(paths, 28800);
          if (se) toast('素材链接读取失败：' + se.message);
          if (signed) signed.forEach(s => {
            const path = s.path || s.name;
            const signedUrl = s.signedUrl || s.signedURL || s.signed_url;
            if (path && signedUrl) urlMap[path] = signedUrl;
          });
        }
        const resolveSrc = f => !f ? undefined : (/^https?:/.test(f) ? f : urlMap[f]);
        db.users = pr.data.map(u => ({ id: u.id, name: u.name, short: u.short || (u.name || '?').slice(0, 1), color: u.color || '#4d718f', role: u.role || 'script', avatarPath: u.avatar_path || null, avatarUrl: u.avatar_path ? (urlMap[u.avatar_path] || null) : null }));
        db.models = mo.data.map(m => ({ id: m.id, kind: m.kind, name: m.name }));
        const versByItem = {};
        vs.data.forEach(v => {
          (versByItem[v.item_id] = versByItem[v.item_id] || []).push({
            id: v.id, v: v.v, at: v.created_at, by: v.created_by, note: v.note,
            body: v.body || undefined, filePath: v.file_path || undefined,
            src: resolveSrc(v.file_path),
            prompt: v.prompt_snapshot || '', model: v.model_snapshot || ''
          });
        });
        const cmByItem = {};
        cm.data.forEach(c => { (cmByItem[c.item_id] = cmByItem[c.item_id] || []).push({ id: c.id, by: c.author_id, at: c.created_at, text: c.text, sys: c.is_system }); });
        const saByScene = {};
        sa.data.forEach(x => { (saByScene[x.scene_id] = saByScene[x.scene_id] || []).push(x.asset_id); });
        const scByProj = {};
        sc.data.forEach(s => { (scByProj[s.project_id] = scByProj[s.project_id] || []).push({ id: s.id, time: s.time_code, title: s.title, action: s.action, visual: s.visual, sound: s.sound, edit: s.edit, imagePrompt: s.image_prompt || '', videoPrompt: s.video_prompt || '', assetIds: saByScene[s.id] || [] }); });
        const filesByAsset = {};
        af.data.forEach(f => {
          (filesByAsset[f.asset_id] = filesByAsset[f.asset_id] || []).push({
            id: f.id, path: f.file_path, label: f.label || '', promptSnap: f.prompt_snapshot || '',
            modelSnap: f.model_snapshot || '', by: f.created_by, at: f.created_at, src: resolveSrc(f.file_path) || null
          });
        });
        const assetsByProj = {};
        ass.data.forEach(a => {
          const files = filesByAsset[a.id] || [];
          const primary = files.find(f => f.id === a.primary_file_id) || files[files.length - 1] || null;
          (assetsByProj[a.project_id] = assetsByProj[a.project_id] || []).push({
            id: a.id, kind: a.kind, refKey: a.ref_key, name: a.name, descr: a.descr || '',
            prompt: a.prompt || '', modelName: a.model_name || '', status: a.status || 'todo',
            ownerId: a.owner_id, primaryFileId: primary ? primary.id : null, files,
            primarySrc: primary ? primary.src : null
          });
        });
        const jobsByProj = {};
        jb.data.forEach(j => { (jobsByProj[j.project_id] = jobsByProj[j.project_id] || []).push({ id: j.id, kind: j.kind, status: j.status, model: j.model || '', error: j.error || '', externalId: j.external_id || null, targetId: j.target_id, at: j.created_at }); });
        const itByProj = {};
        it.data.forEach(i => {
          const versions = versByItem[i.id] || [];
          const withSrc = versions.filter(v => v.src);
          (itByProj[i.project_id] = itByProj[i.project_id] || []).push({
            id: i.id, type: i.type, sceneId: i.scene_id, title: i.title, desc: i.descr,
            status: i.status, ownerId: i.owner_id, prompt: i.prompt,
            model: { name: i.model_name, mode: i.model_mode, refs: i.model_refs },
            versions, comments: cmByItem[i.id] || [],
            asset: withSrc.length ? { src: withSrc[withSrc.length - 1].src, label: i.title } : null,
            createdAt: i.created_at, updatedAt: i.updated_at
          });
        });
        const memByProj = {};
        pm.data.forEach(m => { (memByProj[m.project_id] = memByProj[m.project_id] || []).push({ userId: m.user_id, role: m.role }); });
        db.projects = pj.data.map(p => ({
          id: p.id, topicId: p.topic_id, title: p.title, meta: p.meta, status: p.status,
          stage: p.stage || 'topic', topicText: p.topic_text || '', brief: p.brief || '',
          createdAt: p.created_at, updatedAt: p.updated_at,
          members: memByProj[p.id] || [], scenes: scByProj[p.id] || [], items: itByProj[p.id] || [],
          assets: assetsByProj[p.id] || [], jobs: jobsByProj[p.id] || [], sources: []
        }));
        return true;
      }
      /* ---------- 实时同步 ---------- */
      let reloadTimer = null;
      let liveChannel = null;
      function scheduleReload() {
        clearTimeout(reloadTimer);
        reloadTimer = setTimeout(async () => {
          const ae = document.activeElement;
          if (ae && (ae.tagName === 'TEXTAREA' || (ae.tagName === 'INPUT' && ae.type !== 'file'))) { scheduleReload(); return; }
          if (await loadAll()) renderAllPreserve();
        }, 700);
      }
      function subscribeRealtime() {
        if (liveChannel) sb.removeChannel(liveChannel);
        liveChannel = sb.channel('orbit-live')
          .on('postgres_changes', { event: '*', schema: 'public' }, scheduleReload)
          .subscribe();
      }
      function renderAllPreserve() {
        if (!db.projects.some(p => p.id === state.projectId)) {
          state.projectId = db.projects.length ? db.projects[0].id : null;
          state.sceneId = null; state.sel = null; state.selVersion = null;
        }
        const p = getProject();
        if (p && state.sceneId && !p.scenes.some(s => s.id === state.sceneId)) state.sceneId = p.scenes.length ? p.scenes[0].id : null;
        if (p && state.sel && !p.items.some(i => i.id === state.sel)) { state.sel = null; state.selVersion = null; }
        if (p && state.assetOpen && !p.assets.some(a => a.id === state.assetOpen)) state.assetOpen = null;
        renderAll();
      }

      /* ---------- 启动 ---------- */
      async function boot(session) {
        db.currentUserId = session.user.id;
        const { data: prof, error: profileError } = await sb.from('profiles').select('id').eq('id', session.user.id).maybeSingle();
        if (profileError) {
          renderGate('login', '成员档案读取失败：' + profileError.message);
          return;
        }
        if (!prof) {
          const name = (session.user.email || '成员').split('@')[0];
          const profileWrite = await cw(sb.from('profiles').insert({
            id: session.user.id, name, short: name.slice(0, 1).toUpperCase(),
            color: AVATAR_COLORS[Math.floor(Math.random() * AVATAR_COLORS.length)]
          }), '创建成员档案');
          if (!profileWrite.ok) {
            renderGate('login', '成员档案创建失败，请确认已执行数据库脚本后重试。');
            return;
          }
        }
        if (!(await loadAll())) { renderGate('login', '数据读取失败，请确认已在 SQL Editor 执行 supabase-schema.sql'); return; }
        state.projectId = db.projects.length ? db.projects[0].id : null;
        const p = getProject();
        if (p && p.scenes.length) state.sceneId = p.scenes[0].id;
        state.tab = landingTab(p);
        gate.hidden = true;
        renderAll();
        subscribeRealtime();
      }

      /* ---------- 查询助手 ---------- */
      const getProject = () => db.projects.find(p => p.id === state.projectId) || null;
      const userById = id => db.users.find(u => u.id === id) || { id, name: '成员', short: '?', color: '#a49c8e', role: 'script' };
      const curUser = () => userById(db.currentUserId);
      const topicById = id => categories.find(c => c.id === id);
      const itemById = (p, id) => p.items.find(i => i.id === id);
      const sceneById = (p, id) => p.scenes.find(s => s.id === id);
      const sceneNo = (p, id) => { const i = p.scenes.findIndex(s => s.id === id); return i < 0 ? null : i + 1; };
      const sceneItem = (p, type, sceneId) => p.items.find(i => i.type === type && i.sceneId === sceneId);
      const roleUser = (p, role) => { const m = (p.members || []).find(x => x.role === role); return m ? userById(m.userId) : curUser(); };
      const itemsOf = (p, type) => p.items.filter(i => i.type === type);
      const landingTab = p => (p && p.scenes.length) ? 'scenes' : 'pipeline';
      const CONCEPT_TITLE = '内容概要';
      const conceptItem = p => itemsOf(p, 'script').find(i => i.title === CONCEPT_TITLE) || null;
      const scriptItem = p => itemsOf(p, 'script').find(i => i.title !== CONCEPT_TITLE) || null;
      const doneRatio = p => ({ done: p.items.filter(i => i.status === 'done').length, total: p.items.length });
      const modelsOf = kind => db.models.filter(m => m.kind === kind);
      const modelFor = kind => { const m = modelsOf(kind)[0]; return m ? m.name : '待选择'; };
      const currentSrc = item => {
        if (!item) return null;
        const withSrc = item.versions.filter(v => v.src);
        return (item.asset && item.asset.src) || (withSrc.length ? withSrc[withSrc.length - 1].src : null);
      };

      /* ---------- 云端写入（乐观更新：先改本地镜像再写库） ---------- */
      async function cw(promiseLike, what) {
        try {
          const result = await promiseLike;
          if (result.error) {
            toast(`${what || '保存'}失败：${result.error.message}`);
            scheduleReload();
            return { ok: false, data: result.data };
          }
          return { ok: true, data: result.data };
        } catch (e) {
          toast(`${what || '保存'}失败：网络异常`);
          scheduleReload();
          return { ok: false, data: null };
        }
      }
      function touchLocal(p, item) { const t = now(); if (item) item.updatedAt = t; p.updatedAt = t; }
      function saveItemMeta(p, item, patch) {
        touchLocal(p, item);
        cw(sb.from('items').update(Object.assign({ updated_at: item.updatedAt }, patch || {})).eq('id', item.id), '更新内容');
        cw(sb.from('projects').update({ updated_at: p.updatedAt }).eq('id', p.id), '更新项目时间');
      }
      function sysNote(p, item, text) {
        const c = { id: uuid(), by: db.currentUserId, at: now(), text, sys: true };
        item.comments.push(c);
        cw(sb.from('comments').insert({ id: c.id, item_id: item.id, author_id: c.by, text, is_system: true, created_at: c.at }), '记录');
      }
      function setStatus(p, item, status) {
        if (item.status === status) return;
        item.status = status;
        sysNote(p, item, `将状态改为「${STATUS[status].label}」`);
        saveItemMeta(p, item, { status });
      }
      function setOwner(p, item, userId) {
        if (item.ownerId === userId) return;
        item.ownerId = userId;
        sysNote(p, item, `把负责人改为 ${userById(userId).name}`);
        saveItemMeta(p, item, { owner_id: userId });
      }
      function setPrompt(p, item, text) {
        item.prompt = text;
        const patch = { prompt: text };
        if (item.status === 'todo') { item.status = 'doing'; patch.status = 'doing'; }
        sysNote(p, item, '更新了提示词');
        saveItemMeta(p, item, patch);
      }
      function setModelName(p, item, name) {
        if (item.model.name === name) return;
        item.model.name = name;
        sysNote(p, item, `把模型改为「${name}」`);
        saveItemMeta(p, item, { model_name: name });
      }
      function setModelField(p, item, field, value) {
        item.model[field] = value;
        saveItemMeta(p, item, field === 'mode' ? { model_mode: value } : { model_refs: value });
      }
      function addComment(p, item, text) {
        const c = { id: uuid(), by: db.currentUserId, at: now(), text };
        item.comments.push(c);
        touchLocal(p, item);
        cw(sb.from('comments').insert({ id: c.id, item_id: item.id, author_id: c.by, text, created_at: c.at }), '发表评论');
        cw(sb.from('items').update({ updated_at: item.updatedAt }).eq('id', item.id));
        cw(sb.from('projects').update({ updated_at: p.updatedAt }).eq('id', p.id));
      }
      async function nextVersionNumber(itemId) {
        const { data, error } = await sb.from('item_versions').select('v').eq('item_id', itemId).order('v', { ascending: false }).limit(1);
        if (error) {
          toast('读取版本号失败：' + error.message);
          return null;
        }
        return (data && data.length ? data[0].v : 0) + 1;
      }
      const versionModelSnapshot = item => `模型：${item.model.name}\n模式：${item.model.mode}\n参考：${item.model.refs}`;
      async function addVersion(p, item, note, file) {
        const v = await nextVersionNumber(item.id);
        if (!v) return false;
        const ver = { id: uuid(), v, at: now(), by: db.currentUserId, note: (note || '').trim() || `第 ${v} 次生成`, prompt: item.prompt || '', model: versionModelSnapshot(item) };
        let filePath = null;
        if (file) {
          const safe = file.name.replace(/[^\w.\-一-龥]+/g, '_');
          filePath = `items/${item.id}/v${v}-${Date.now()}-${safe}`;
          const { error: upErr } = await sb.storage.from('assets').upload(filePath, file, { contentType: file.type || undefined });
          if (upErr) { toast('文件上传失败：' + upErr.message); return false; }
          ver.filePath = filePath;
        }
        const versionWrite = await cw(sb.from('item_versions').insert({
          id: ver.id, item_id: item.id, v, note: ver.note, file_path: filePath,
          prompt_snapshot: ver.prompt, model_snapshot: ver.model, created_by: ver.by, created_at: ver.at
        }), '登记版本');
        if (!versionWrite.ok) {
          if (filePath) await cw(sb.storage.from('assets').remove([filePath]), '清理未登记文件');
          return false;
        }
        if (filePath) {
          const { data: signed, error: signError } = await sb.storage.from('assets').createSignedUrl(filePath, 28800);
          if (signError) toast('版本已登记，但预览链接生成失败：' + signError.message);
          else ver.src = signed.signedUrl;
        }
        item.versions.push(ver);
        if (ver.src) item.asset = { src: ver.src, label: item.title };
        const patch = {};
        if (item.status === 'todo' || item.status === 'doing') { item.status = 'review'; patch.status = 'review'; }
        sysNote(p, item, `登记生成结果 v${v}${filePath ? '（含文件）' : ''}`);
        saveItemMeta(p, item, patch);
        return true;
      }
      async function addCopyVersion(p, item, note, body) {
        const v = await nextVersionNumber(item.id);
        if (!v) return false;
        const ver = { id: uuid(), v, at: now(), by: db.currentUserId, note: note || `第 ${v} 版`, body, prompt: item.prompt || '', model: versionModelSnapshot(item) };
        const versionWrite = await cw(sb.from('item_versions').insert({
          id: ver.id, item_id: item.id, v, note: ver.note, body,
          prompt_snapshot: ver.prompt, model_snapshot: ver.model, created_by: ver.by, created_at: ver.at
        }), '保存文案版本');
        if (!versionWrite.ok) return false;
        item.versions.push(ver);
        const patch = {};
        if (item.status === 'todo') { item.status = 'doing'; patch.status = 'doing'; }
        saveItemMeta(p, item, patch);
        return true;
      }
      async function deleteVersion(p, item, vNo) {
        const ver = item.versions.find(x => x.v === vNo);
        if (!ver) return false;
        const versionDelete = await cw(sb.from('item_versions').delete().eq('id', ver.id), '删除版本');
        if (!versionDelete.ok) return false;
        if (ver.filePath) await cw(sb.storage.from('assets').remove([ver.filePath]), '删除文件');
        if (ver.src && item.asset && item.asset.src === ver.src) item.asset = null;
        item.versions = item.versions.filter(x => x.v !== vNo);
        const rest = item.versions.filter(x => x.src);
        if (!item.asset && rest.length) item.asset = { src: rest[rest.length - 1].src, label: item.title };
        if (state.selVersion === vNo) state.selVersion = null;
        sysNote(p, item, `删除了版本 v${vNo}`);
        saveItemMeta(p, item);
        return true;
      }
      async function downloadVersion(ver, title) {
        if (!ver.filePath) return;
        const { data, error } = await sb.storage.from('assets').createSignedUrl(ver.filePath, 300, { download: true });
        if (error || !data) { toast('下载链接生成失败'); return; }
        const a = document.createElement('a');
        a.href = data.signedUrl;
        a.download = '';
        document.body.appendChild(a); a.click(); a.remove();
      }
      async function deleteItem(p, id) {
        const item = itemById(p, id);
        if (!item) return false;
        const files = item.versions.filter(v => v.filePath).map(v => v.filePath);
        const itemDelete = await cw(sb.from('items').delete().eq('id', id), '删除内容');
        if (!itemDelete.ok) return false;
        if (files.length) await cw(sb.storage.from('assets').remove(files), '删除文件');
        p.items = p.items.filter(i => i.id !== id);
        if (state.sel === id) { state.sel = null; state.selVersion = null; }
        touchLocal(p, null);
        cw(sb.from('projects').update({ updated_at: p.updatedAt }).eq('id', p.id));
        return true;
      }
      async function deleteScene(p, sceneId) {
        const doomed = p.items.filter(i => i.sceneId === sceneId);
        const files = doomed.flatMap(i => i.versions.filter(v => v.filePath).map(v => v.filePath));
        const sceneDelete = await cw(sb.from('scenes').delete().eq('id', sceneId), '删除场景');
        if (!sceneDelete.ok) return false;
        if (files.length) await cw(sb.storage.from('assets').remove(files), '删除文件');
        const removed = new Set(doomed.map(i => i.id));
        p.scenes = p.scenes.filter(s => s.id !== sceneId);
        p.items = p.items.filter(i => i.sceneId !== sceneId);
        if (removed.has(state.sel)) { state.sel = null; state.selVersion = null; }

      /* =====================================================================
         AI 流水线（主题 → 概要 → 剧本 → 分镜与资产 → 生成）
         每一步都停下确认；生成统一走 Edge Function generate，前端不接触密钥。
         ===================================================================== */
      const PIPE_STAGES = [
        ['topic', '主题'], ['concept', '内容概要'], ['script', '剧本'],
        ['breakdown', '分镜与资产'], ['generate', '生成'],
      ];
      const KIND_CN = { character: '角色', environment: '环境', prop: '道具' };
      const stageIdx = s => { const i = PIPE_STAGES.findIndex(x => x[0] === s); return i < 0 ? 0 : i; };
      const draftKey = k => `${state.projectId}:${k}`;
      const getDraft = (k, fb) => { const v = state.drafts[draftKey(k)]; return v === undefined ? fb : v; };
      const setDraft = (k, v) => { state.drafts[draftKey(k)] = v; };

      async function callGenerate(body) {
        try {
          const { data, error } = await sb.functions.invoke('generate', { body });
          if (error) {
            let msg = error.message || '调用失败';
            try { const j = await error.context.json(); if (j && j.error) msg = j.error; } catch (e2) {}
            return { ok: false, error: msg };
          }
          if (data && data.error && !data.ok) return { ok: false, error: data.error };
          return data || { ok: false, error: '空响应' };
        } catch (e) { return { ok: false, error: e && e.message ? e.message : String(e) }; }
      }
      /**
       * 流式文本。逐段回调 onChunk，界面上就能看着字往外冒，不用干等整篇写完。
       * supabase-js 的 invoke 不支持流，所以这里直连函数地址。
       * 流式不可用时返回 null，调用方自动退回一次性调用。
       */
      async function callGenerateStream(body, onChunk) {
        try {
          const cfg = getConfig();
          const { data: sess } = await sb.auth.getSession();
          const token = sess && sess.session ? sess.session.access_token : cfg.anonKey;
          const res = await fetch(`${cfg.url}/functions/v1/generate`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', apikey: cfg.anonKey, Authorization: `Bearer ${token}` },
            body: JSON.stringify({ ...body, action: 'text_stream' })
          });
          if (!res.ok || !res.body) return null;
          if (!(res.headers.get('content-type') || '').includes('text/event-stream')) return null;
          const reader = res.body.getReader();
          const dec = new TextDecoder();
          let buf = '', text = '';
          for (;;) {
            const { value, done } = await reader.read();
            if (done) break;
            buf += dec.decode(value, { stream: true });
            const lines = buf.split('\n');
            buf = lines.pop() || '';
            for (const line of lines) {
              const t = line.trim();
              if (!t.startsWith('data:')) continue;
              const payload = t.slice(5).trim();
              if (!payload || payload === '[DONE]') continue;
              try {
                const piece = JSON.parse(payload).choices?.[0]?.delta?.content;
                if (piece) { text += piece; onChunk(text); }
              } catch (e) { /* 心跳或非 JSON 行，跳过 */ }
            }
          }
          return text ? { ok: true, content: text, model: res.headers.get('X-Model-Used') || '' } : null;
        } catch (e) { return null; }
      }

      async function registerAssetFile(p, asset, up, label, promptSnap, modelSnap) {
        const id = uuid();

        if (!ins.ok) return null;

      async function genAssetImage(p, asset, opt) {
        const silent = !!(opt && opt.silent);
        const key = `a:${asset.id}`;
        if (state.busy[key]) return;
        if (!asset.prompt) { toast(`「${asset.name}」还没有提示词`); return; }
        if (!silent) { setBusy(key, '生成中…'); renderWorkspace(); }
        const jobId = await createJob(p, 'asset_image', 'assets', asset.id, { prompt: asset.prompt });
        const r = await callGenerate({ action: 'image', prompt: asset.prompt });
        if (!r.ok) {
          await finishJob(jobId, false, { error: r.error });
          toast(`「${asset.name}」生成失败：${r.error}`);
        } else {
          const up = await imageResultToUpload(r);

          await finishJob(jobId, !!rec, { model: r.model || '', model_tried: JSON.stringify(r.tried || []) });

      // 批量生成：先靠第一张校准风格，确认后再把剩下的一次跑完。
      // 逐个串行执行，任何一步失败就停下来——避免一路错到底烧掉额度。
      async function runBatch(p, key, jobs, label) {
        if (state.busy[key]) return;
        if (!jobs.length) { toast('没有需要生成的项目'); return; }
        let done = 0;
        for (const job of jobs) {
          setBusy(key, `${label} ${done + 1}/${jobs.length}…`); renderWorkspace();
          const before = job.count();
          await job.run();
          if (job.count() === before) { setBusy(key); renderAll(); toast(`${label}中断：第 ${done + 1} 个没成功，先看看提示再继续`); return; }
          done += 1;
        }
        setBusy(key); renderAll();
        toast(`${label}完成：${done} 个`);

        const prompt = scene.videoPrompt || vItem.prompt || '';
        const key = `sv:${scene.id}`;
        if (state.busy[key]) return;
        setBusy(key, '提交视频任务…'); renderWorkspace();
        const jobId = await createJob(p, 'scene_video', 'items', vItem.id, { prompt });
        const r = await callGenerate({ action: 'video', prompt, firstFrameUrl: first });

      async function pollVideoLoop(projectId, jobId, taskId, itemId, sceneId, prompt, model, tries) {
        if (tries > 60) {
          await finishJob(jobId, false, { error: '轮询超时（8 分钟）' });
          setBusy(`sv:${sceneId}`); toast('视频生成超时，可稍后在任务记录里重试'); renderAll(); return;
        }
        await new Promise(res => setTimeout(res, 8000));
        const p = db.projects.find(x => x.id === projectId);
        if (!p) return;
        const r = await callGenerate({ action: 'poll_video', taskId });
        if (r && r.ok && r.url) {
          const item = itemById(p, itemId);
          const done = item ? await registerVideoResult(p, item, r.url, prompt, model) : false;
          if (done && item && (item.status === 'todo' || item.status === 'doing')) { item.status = 'review'; cw(sb.from('items').update({ status: 'review', updated_at: now() }).eq('id', item.id)); }
          await finishJob(jobId, done, { model: model || '' });
          setBusy(`sv:${sceneId}`);

        if (r && r.ok === false) {

          setBusy(`sv:${sceneId}`); toast('视频任务查询失败：' + (r.error || '')); renderAll(); return;

        pollVideoLoop(projectId, jobId, taskId, itemId, sceneId, prompt, model, tries + 1);

      /* ---------- 文本生成（各步骤提示词） ---------- */

      async function pipeGenText(p, key, jobKind, prompt, system, draftKey, fast) {

      /* ---------- 分镜结构化生成与落库 ---------- */
      function breakdownPrompt(p) {
        const concept = latestBody(conceptItem(p));
        const script = latestBody(scriptItem(p));
        return `根据以下无旁白短片剧本，输出分镜与数字资产清单。

主题：${topicLine(p)}
内容概要：${concept}
剧本：
${script}

要求：
1. 只输出一个 JSON 对象，不要任何解释、不要 markdown 代码块。
2. 结构：{"assets":[{"ref_key","kind","name","descr","prompt"}],"scenes":[{"title","time","action","visual","sound","edit","image_prompt","video_prompt","asset_refs":["ref_key"]}]}
3. assets：整片需要的数字资产。kind 只能是 character / environment / prop；ref_key 用英文小写加下划线并带前缀（char_ / env_ / prop_）；prompt 是给图片模型的生成提示词（中文，含画风、光线、材质约束，写明"不出现文字、水印"）。资产控制在 3-6 个。
4. scenes：6-10 个场景。time 用 "00:00-00:18" 格式并覆盖全片；asset_refs 只引用 assets 里出现过的 ref_key。
5. 每个场景必须写满八要素，各自一句话，不要留空：
   subject 主体——这一镜的画面主角是谁/什么，用 assets 里的名字；
   composition 构图——景别与机位（如"中近景，略微仰拍"）；
   light 光线——光源方向、明暗与色温；
   background 背景——环境与景深处理；
   action 动作——这 5 秒内主体做了什么，要有起止；
   overlay 文字叠加——需要压在画面上的字幕或标题；没有就写"无"；
   transition 转场——进入下一镜的方式（硬切/叠化/黑场等）；
   audio 音频——环境声、音效与音乐情绪。
6. image_prompt 由前四项加 subject 组合成一句完整的静帧画面描述（会以 asset_refs 对应的资产图作参考图，需注明"不出现文字、水印"）；video_prompt 由 action 加运镜写成 5 秒内的镜头运动描述。

      // 八要素落进现有的 action / visual / sound / edit 四个字段，不需要改数据库

        if (s.light) parts.push('光线：' + s.light);
        if (s.background) parts.push('背景：' + s.background);
        const overlay = (s.overlay || '').trim();
        if (overlay && !/^无$|^none$/i.test(overlay)) parts.push('文字叠加：' + overlay);
        return parts.join('　');

      /* ---------- 流水线视图 ---------- */

        const cur = stageIdx(curStage);
        const steps = PIPE_STAGES.map(([key, label], i) => {
          const cls = i < cur ? 'done' : (i === cur ? 'active' : 'todo');
          return `<button type="button" class="pipe-step ${cls}" data-stage-jump="${key}" ${i > cur ? 'disabled' : ''}>${i < cur ? '✓ ' : `${i + 1} `}${label}</button>`;
        }).join('');
        let pane = '';
        if (curStage === 'topic') pane = paneTopic(p);
        else if (curStage === 'concept') pane = paneConcept(p);
        else if (curStage === 'script') pane = paneScript(p);
        else if (curStage === 'breakdown') pane = paneBreakdown(p);

          <div class="pipe-pane">${pane}</div>`;
        viewRoot.querySelectorAll('[data-stage-jump]').forEach(b => b.addEventListener('click', () => {
          const target = b.dataset.stageJump;
          if (stageIdx(target) >= stageIdx(p.stage === 'done' ? 'generate' : p.stage) && target !== curStage) return;
          if (target === curStage) return;
          armOr(b, '回到此步？', async () => { await saveProjectPatch(p, { stage: target }, { stage: target }); renderWorkspace(); });
